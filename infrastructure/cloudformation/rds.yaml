AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MediSlot data foundation - private RDS MySQL, DynamoDB tables,
  Secrets Manager, and private S3 artifacts bucket.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  PrivateDbSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: First private database subnet from the Network stack.

  PrivateDbSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Second private database subnet from the Network stack.

  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Database security group from the Network stack.

  DBName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: Initial MySQL database name.

  DBUsername:
    Type: String
    Default: medislot_admin
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: RDS master username.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t4g.micro
      - db.t4g.small
      - db.m6g.large

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000

  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable deletion protection for production databases.

# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  IsProd: !Equals
    - !Ref EnvironmentName
    - prod

  DeletionProtectionEnabled: !Equals
    - !Ref EnableDeletionProtection
    - 'true'

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ----------------------------------------------------------
  # DATABASE CREDENTIALS
  # ----------------------------------------------------------

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/database'
      Description: !Sub 'MediSlot ${EnvironmentName} RDS credentials'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # RDS SUBNET GROUP
  # ----------------------------------------------------------

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for MediSlot RDS.
      SubnetIds:
        - !Ref PrivateDbSubnet1Id
        - !Ref PrivateDbSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-db-subnet-group'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # RDS MYSQL DATABASE
  # ----------------------------------------------------------

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${EnvironmentName}-mysql'

      Engine: mysql
      EngineVersion: '8.4.9'

      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'
        - SecretArn: !Ref DatabaseSecret

      DBSubnetGroupName: !Ref DatabaseSubnetGroup

      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId

      PubliclyAccessible: false

      MultiAZ: !If
        - IsProd
        - true
        - false

      BackupRetentionPeriod: !If
        - IsProd
        - 7
        - 1

      DeletionProtection: !If
        - DeletionProtectionEnabled
        - true
        - false

      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

      EnableCloudwatchLogsExports:
        - error
        - general
        - slowquery

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-mysql'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # DYNAMODB: IDEMPOTENCY
  # ----------------------------------------------------------

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-idempotency'
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S

      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If
          - IsProd
          - true
          - false

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # DYNAMODB: SLOT CAPACITY
  # ----------------------------------------------------------

  SlotCapacityTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-slot-capacity'
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S

      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If
          - IsProd
          - true
          - false

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # DYNAMODB: WAITLIST
  # ----------------------------------------------------------

  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-waitlist'
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S

      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If
          - IsProd
          - true
          - false

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # DYNAMODB: NOTIFICATION DISPATCH
  # ----------------------------------------------------------

  NotificationDispatchTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-notification-dispatch'
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: dispatch_id
          AttributeType: S

      KeySchema:
        - AttributeName: dispatch_id
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If
          - IsProd
          - true
          - false

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # S3: PRIVATE ARTIFACTS BUCKET
  # ----------------------------------------------------------

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-artifacts'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName




  # ----------------------------------------------------------
  # S3: PRIVATE REPORTS BUCKET
  # ----------------------------------------------------------

  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-reports'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
          

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DBEndpointAddress:
    Description: Private RDS endpoint hostname.
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-DBEndpointAddress'

  DBEndpointPort:
    Description: MySQL port.
    Value: !GetAtt MediSlotDatabase.Endpoint.Port

  DBName:
    Description: Initial MySQL database name.
    Value: !Ref DBName

  DBSecretArn:
    Description: ARN of the Secrets Manager secret containing database credentials.
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-DBSecretArn'

  IdempotencyTableName:
    Description: DynamoDB idempotency table name.
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-IdempotencyTableName'

  SlotCapacityTableName:
    Description: DynamoDB slot capacity table name.
    Value: !Ref SlotCapacityTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-SlotCapacityTableName'

  WaitlistTableName:
    Description: DynamoDB waitlist table name.
    Value: !Ref WaitlistTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-WaitlistTableName'

  NotificationDispatchTableName:
    Description: DynamoDB notification dispatch table name.
    Value: !Ref NotificationDispatchTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-NotificationDispatchTableName'

  ArtifactsBucketName:
    Description: Private S3 artifacts bucket name.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-ArtifactsBucketName'