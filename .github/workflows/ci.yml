name: MediSlot CI

on:
  push:
    branches: [master, milestone-2-branch, milestone-3-branch]
  pull_request:
    branches: [master, milestone-2-branch, milestone-3-branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-cloudformation:
    name: IaC scan (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint
      - name: Lint every deployed template
        run: |
          cfn-lint -i W -- \
            infrastructure/cloudformation/network.yaml \
            infrastructure/cloudformation/rds.yaml \
            infrastructure/cloudformation/dynamodb.yaml \
            infrastructure/cloudformation/storage.yaml \
            infrastructure/cloudformation/auth.yaml \
            infrastructure/cloudformation/doctor.yaml \
            infrastructure/cloudformation/api.yaml \
            infrastructure/cloudformation/web.yaml

  lint-and-unit-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 application scripts web tests --select=E9,F --exclude=application/booking,application/notification,application/patient,application/availability,application/refund,application/waitlist,application/doctor
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/unit -v
