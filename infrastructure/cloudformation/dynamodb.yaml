AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Milestone 2 authentication state tables

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  RefreshTokenTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-refresh-tokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TokenActiveListTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-token-activelist'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: session_id-index
          KeySchema:
            - AttributeName: session_id
              KeyType: HASH
            - AttributeName: jti
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  RefreshTokenTableName:
    Description: DynamoDB refresh token table name
    Value: !Ref RefreshTokenTable
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-RefreshTokenTableName'
  RefreshTokenTableArn:
    Description: DynamoDB refresh token table ARN
    Value: !GetAtt RefreshTokenTable.Arn
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-RefreshTokenTableArn'
  TokenActiveListTableName:
    Description: DynamoDB token active-list table name
    Value: !Ref TokenActiveListTable
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-TokenActiveListTableName'
  TokenActiveListTableArn:
    Description: DynamoDB token active-list table ARN
    Value: !GetAtt TokenActiveListTable.Arn
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-TokenActiveListTableArn'
