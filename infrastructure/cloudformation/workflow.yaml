AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MediSlot reschedule saga (Milestone 6): an AWS Step Functions EXPRESS state machine that moves an appointment to
  another slot of the same doctor. Steps: Validate -> ClaimTarget -> MoveAppointment -> ReleaseOriginal -> Publish.
  If MoveAppointment or ReleaseOriginal fails AFTER the target seat was claimed, the state machine runs Compensate
  (put the appointment back, give the target seat back) and ends with the error RescheduleCompensated.
  The step Lambda runs inside the VPC because it reads and writes RDS.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseSecretArn:
    Type: String
  DatabaseHost:
    Type: String
  DatabaseName:
    Type: String
    Default: medislot
  SlotCapacityTableName:
    Type: String
  WaitlistTableName:
    Type: String
  HoldOffersTableName:
    Type: String
  IdempotencyTableName:
    Type: String
  EventBusName:
    Type: String

Resources:
  # ------------------------------------------------------------------ the step Lambda
  RescheduleStepRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-reschedule-step-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Policies:
        - PolicyName: RescheduleStepAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseCredentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Sid: ReadBusinessRules
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/rules/*'
              - Sid: SeatCounters
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SlotCapacityTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdempotencyTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WaitlistTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WaitlistTableName}/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldOffersTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldOffersTableName}/index/*'
              - Sid: PublishEvents
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}'
              - Sid: PublishMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: MediSlot
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  RescheduleStepFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-reschedule-step'
      Runtime: python3.12
      Handler: application.reschedule.handler.lambda_handler
      Role: !GetAtt RescheduleStepRole.Arn
      Timeout: 25
      MemorySize: 512
      TracingConfig:
        Mode: Active
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DB_HOST: !Ref DatabaseHost
          DB_NAME: !Ref DatabaseName
          SSM_PREFIX: !Sub '/${ProjectName}/${EnvironmentName}'
          SLOT_CAPACITY_TABLE_NAME: !Ref SlotCapacityTableName
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTableName
          WAITLIST_TABLE_NAME: !Ref WaitlistTableName
          HOLD_OFFERS_TABLE_NAME: !Ref HoldOffersTableName
          EVENT_BUS_NAME: !Ref EventBusName
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ------------------------------------------------------------------ the state machine
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${ProjectName}-${EnvironmentName}-reschedule'
      RetentionInDays: 30

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-reschedule-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: RunTheSteps
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeStepFunction
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RescheduleStepFunction.Arn
              # AWS requires Resource '*' for these log-delivery and X-Ray actions (no resource-level support).
              - Sid: DeliverLogs
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
              - Sid: TraceWithXRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  RescheduleStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-${EnvironmentName}-reschedule'
      StateMachineType: EXPRESS
      RoleArn: !GetAtt StateMachineRole.Arn
      TracingConfiguration:
        Enabled: true
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionSubstitutions:
        StepFunctionArn: !GetAtt RescheduleStepFunction.Arn
      DefinitionString: |-
        {
          "Comment": "MediSlot reschedule saga: claim the target seat, move the appointment, release the original seat; compensate if a later step fails.",
          "StartAt": "Validate",
          "States": {
            "Validate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"validate\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 1, "MaxAttempts": 2, "BackoffRate": 2}],
              "Next": "ClaimTarget"
            },
            "ClaimTarget": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"claim_target\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 1, "MaxAttempts": 2, "BackoffRate": 2}],
              "Next": "MoveAppointment"
            },
            "MoveAppointment": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"move_appointment\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 1, "MaxAttempts": 2, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "Compensate"}],
              "Next": "ReleaseOriginal"
            },
            "ReleaseOriginal": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"release_original\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 1, "MaxAttempts": 2, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "Compensate"}],
              "Next": "Publish"
            },
            "Publish": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"publish\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["States.ALL"], "IntervalSeconds": 1, "MaxAttempts": 2, "BackoffRate": 2}],
              "Next": "Final"
            },
            "Final": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"final\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["States.ALL"], "IntervalSeconds": 1, "MaxAttempts": 2, "BackoffRate": 2}],
              "End": true
            },
            "Compensate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StepFunctionArn}",
                "Payload.$": "States.JsonMerge($, States.StringToJson('{\"step\":\"compensate\"}'), false)"
              },
              "OutputPath": "$.Payload",
              "Retry": [{"ErrorEquals": ["States.ALL"], "IntervalSeconds": 1, "MaxAttempts": 4, "BackoffRate": 2}],
              "Next": "RescheduleCompensated"
            },
            "RescheduleCompensated": {
              "Type": "Fail",
              "Error": "RescheduleCompensated",
              "Cause": "A step failed after the target seat was claimed; the appointment was put back and the seat released."
            }
          }
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  RescheduleStateMachineArn:
    Value: !Ref RescheduleStateMachine
  RescheduleStateMachineName:
    Value: !GetAtt RescheduleStateMachine.Name
  RescheduleStepFunctionName:
    Value: !Ref RescheduleStepFunction
