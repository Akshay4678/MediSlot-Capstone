AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Milestone 4 patient-domain API and hold-offer expiry worker.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseSecretArn:
    Type: String
  DatabaseHost:
    Type: String
  DatabaseName:
    Type: String
    Default: medislot
  IdempotencyTableName:
    Type: String
  WaitlistTableName:
    Type: String
  HoldOffersTableName:
    Type: String
  EventBusName:
    Type: String
    Default: default

Resources:
  PatientApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-patient-api-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: PatientApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseCredentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Sid: PatientDynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdempotencyTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WaitlistTableName}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldOffersTableName}'
                  - Fn::ImportValue:
                      Fn::Sub: '${ProjectName}-${EnvironmentName}-NotificationDispatchTableArn'
              - Sid: ReadBusinessRules
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/rules/*'
              - Sid: PublishDomainEvents
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PatientApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-patient-api'
      Runtime: python3.12
      Handler: application.patient_api.handler.lambda_handler
      Role: !GetAtt PatientApiRole.Arn
      Timeout: 29
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DB_HOST: !Ref DatabaseHost
          DB_NAME: !Ref DatabaseName
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTableName
          WAITLIST_TABLE_NAME: !Ref WaitlistTableName
          HOLD_OFFERS_TABLE_NAME: !Ref HoldOffersTableName
          EVENT_BUS_NAME: !Ref EventBusName
          SSM_PREFIX: !Sub '/${ProjectName}/${EnvironmentName}'
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  HoldOfferExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-hold-offer-expiry-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HoldOfferExpiryAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HoldOffersTableName}'

  HoldOfferExpiryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-hold-offer-expiry'
      Runtime: python3.12
      Handler: application.patient_api.expiry.lambda_handler
      Role: !GetAtt HoldOfferExpiryRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          HOLD_OFFERS_TABLE_NAME: !Ref HoldOffersTableName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ReminderDispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-reminder-dispatcher'
      Runtime: python3.12
      Handler: application.notification.reminders.lambda_handler
      Role: !GetAtt PatientApiRole.Arn
      Timeout: 29
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DB_HOST: !Ref DatabaseHost
          DB_NAME: !Ref DatabaseName
          NOTIFICATION_DISPATCH_TABLE_NAME: !ImportValue
            Fn::Sub: '${ProjectName}-${EnvironmentName}-NotificationDispatchTableName'
          EVENT_BUS_NAME: !Ref EventBusName
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ReminderSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-appointment-reminders'
      ScheduleExpression: 'rate(15 minutes)'
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt ReminderDispatcherFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{}'

  HoldOfferExpirySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-hold-offer-expiry'
      ScheduleExpression: 'rate(1 minute)'
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt HoldOfferExpiryFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{}'

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-hold-offer-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeExpiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt HoldOfferExpiryFunction.Arn

Outputs:
  PatientApiFunctionArn:
    Value: !GetAtt PatientApiFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PatientApiFunctionArn'
  PatientApiFunctionName:
    Value: !Ref PatientApiFunction
