AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Milestone 2 authentication API only.
Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ArtifactBucket:
    Type: String
    Description: Private S3 bucket holding the zipped Lambda deployment package.
  ArtifactKey:
    Type: String
    Description: S3 key for the zipped Lambda deployment package.
  AuthLambdaRoleArn:
    Type: String
  AuthorizerLambdaRoleArn:
    Type: String
  RefreshTokenTableName:
    Type: String
  TokenDenylistTableName:
    Type: String
  JwtSecretParameterName:
    Type: String
    Default: /medislot/dev/jwt-secret
  RegisterHandler:
    Type: String
    Default: application.auth.register.lambda_handler
  LoginHandler:
    Type: String
    Default: application.auth.login.lambda_handler
  RefreshHandler:
    Type: String
    Default: application.auth.refresh.lambda_handler
  LogoutHandler:
    Type: String
    Default: application.auth.logout.lambda_handler
  AuthorizerHandler:
    Type: String
    Default: application.auth.authorizer.lambda_handler
Resources:
  MediSlotApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${EnvironmentName}-medislot-api'
      EndpointConfiguration: {Types: [REGIONAL]}
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !GetAtt MediSlotApi.RootResourceId
      PathPart: auth
  RegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: register
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: login
  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: refresh
  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: logout
  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-medislot-auth-register'
      Runtime: python3.12
      Handler: !Ref RegisterHandler
      Role: !Ref AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          REFRESH_TOKEN_TABLE_NAME: !Ref RefreshTokenTableName
          TOKEN_DENYLIST_TABLE_NAME: !Ref TokenDenylistTableName
  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-medislot-auth-login'
      Runtime: python3.12
      Handler: !Ref LoginHandler
      Role: !Ref AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          REFRESH_TOKEN_TABLE_NAME: !Ref RefreshTokenTableName
  RefreshFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-medislot-auth-refresh'
      Runtime: python3.12
      Handler: !Ref RefreshHandler
      Role: !Ref AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      Environment:
        Variables:
          REFRESH_TOKEN_TABLE_NAME: !Ref RefreshTokenTableName
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
  LogoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-medislot-auth-logout'
      Runtime: python3.12
      Handler: !Ref LogoutHandler
      Role: !Ref AuthLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      Environment:
        Variables:
          REFRESH_TOKEN_TABLE_NAME: !Ref RefreshTokenTableName
          TOKEN_DENYLIST_TABLE_NAME: !Ref TokenDenylistTableName
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-medislot-authorizer'
      Runtime: python3.12
      Handler: !Ref AuthorizerHandler
      Role: !Ref AuthorizerLambdaRoleArn
      Timeout: 10
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
      Environment:
        Variables:
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          TOKEN_DENYLIST_TABLE_NAME: !Ref TokenDenylistTableName
  MediSlotAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${EnvironmentName}-medislot-authorizer'
      RestApiId: !Ref MediSlotApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri: !Sub
        - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
        - FunctionArn: !GetAtt AuthorizerFunction.Arn
      AuthorizerResultTtlInSeconds: 0
  RegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref RegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn: !GetAtt RegisterFunction.Arn
  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn: !GetAtt LoginFunction.Arn
  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn: !GetAtt RefreshFunction.Arn
  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn: !GetAtt LogoutFunction.Arn
  RegisterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegisterFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApi}/*/POST/auth/register'
  LoginPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApi}/*/POST/auth/login'
  RefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RefreshFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApi}/*/POST/auth/refresh'
  LogoutPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogoutFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApi}/*/POST/auth/logout'
  AuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotApi}/authorizers/${MediSlotAuthorizer}'
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RegisterMethod, LoginMethod, RefreshMethod, LogoutMethod]
    Properties:
      RestApiId: !Ref MediSlotApi
      Description: !Sub 'MediSlot Milestone 2 ${EnvironmentName} auth API'
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MediSlotApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref EnvironmentName
Outputs:
  ApiId:
    Value: !Ref MediSlotApi
    Export: {Name: !Sub '${EnvironmentName}-MediSlot-ApiId'}
  ApiBaseUrl:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}'
  RegisterEndpoint:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/auth/register'
  LoginEndpoint:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/auth/login'
  RefreshEndpoint:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/auth/refresh'
  LogoutEndpoint:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/auth/logout'
