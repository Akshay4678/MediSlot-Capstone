AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MediSlot booking tables (Milestones 5 and 6): the slot capacity counter (optimistic concurrency), the
  idempotency store, the waitlist queue, the hold offers and the notification dispatch log. Table names are generated by CloudFormation and handed to the Lambda stacks as parameters.
  If a table is deleted by hand, the pipeline (scripts/ensure_dynamodb_stack.sh) re-creates this stack.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

Resources:
  # PK slot_id; attributes booked_count and version. Written ONLY with conditional updates.
  SlotCapacityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S
      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # PK idempotency_key ("<user_id>#<Idempotency-Key>"); expires_at is the TTL attribute.
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # PK slot_id + SK patient_id: a patient is in a slot's queue at most once (conditional put).
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: joined_at
          AttributeType: S
      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
        - AttributeName: patient_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: order-index
          KeySchema:
            - AttributeName: slot_id
              KeyType: HASH
            - AttributeName: joined_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: patient-index
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
            - AttributeName: slot_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # PK offer_id. status LIVE|ACCEPTED|EXPIRED|CANCELLED, changed only with conditional writes; purge_at is the TTL.
  HoldOffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: offer_id
          AttributeType: S
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: expires_at
          AttributeType: N
      KeySchema:
        - AttributeName: offer_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: slot-index
          KeySchema:
            - AttributeName: slot_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: patient-index
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: purge_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # PK dispatch_id "<appointmentId>#<interval>#<recipient>": the exactly-once notification log. expires_at is the TTL.
  DispatchLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatch_id
          AttributeType: S
      KeySchema:
        - AttributeName: dispatch_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  SlotCapacityTableName:
    Description: DynamoDB slot capacity table name.
    Value: !Ref SlotCapacityTable
  IdempotencyTableName:
    Description: DynamoDB idempotency table name.
    Value: !Ref IdempotencyTable
  WaitlistTableName:
    Value: !Ref WaitlistTable
  HoldOffersTableName:
    Value: !Ref HoldOffersTable
  DispatchLogTableName:
    Value: !Ref DispatchLogTable
  SlotCapacityTableArn:
    Value: !GetAtt SlotCapacityTable.Arn
  IdempotencyTableArn:
    Value: !GetAtt IdempotencyTable.Arn
  WaitlistTableArn:
    Value: !GetAtt WaitlistTable.Arn
  HoldOffersTableArn:
    Value: !GetAtt HoldOffersTable.Arn
  DispatchLogTableArn:
    Value: !GetAtt DispatchLogTable.Arn
