AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Milestone 2 authentication API - registration, login, refresh, logout and JWT authorizer only.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LambdaCodeS3Bucket:
    Type: String
    Description: Existing private S3 bucket containing the Lambda deployment ZIP.
  LambdaCodeS3Key:
    Type: String
    Description: S3 object key for the Lambda deployment ZIP.
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two existing private application subnet IDs.
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing application Lambda security group ID.
  DatabaseSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing RDS credentials.
  DatabaseHost:
    Type: String
    Description: Private RDS endpoint hostname.
  DatabaseName:
    Type: String
    Default: medislot
  JwtSecretParameterName:
    Type: String
    Description: SSM SecureString parameter containing the JWT signing secret.
  RefreshTokenTableName:
    Type: String
    Description: Existing refresh-token DynamoDB table name.
  TokenDenylistTableName:
    Type: String
    Description: Existing token-denylist DynamoDB table name.

Resources:
  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-auth'
      Runtime: python3.12
      Handler: application.auth.handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AuthLambdaExecutionRoleArn'
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          JWT_ISSUER: medislot
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DB_HOST: !Ref DatabaseHost
          DB_NAME: !Ref DatabaseName
          REFRESH_TOKEN_TABLE: !Ref RefreshTokenTableName
          TOKEN_DENYLIST_TABLE: !Ref TokenDenylistTableName
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-authorizer'
      Runtime: python3.12
      Handler: application.authorizer.handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AuthorizerLambdaExecutionRoleArn'
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          JWT_ISSUER: medislot
          TOKEN_DENYLIST_TABLE: !Ref TokenDenylistTableName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  MediSlotHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  MediSlotLambdaAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref MediSlotHttpApi
      Name: !Sub '${ProjectName}-${EnvironmentName}-lambda-authorizer'
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub
        - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations'
        - AuthorizerArn: !GetAtt AuthorizerFunction.Arn
      IdentitySource: ['$request.header.Authorization']
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true

  AuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MediSlotHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt AuthFunction.Arn
      PayloadFormatVersion: '2.0'

  AuthRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MediSlotHttpApi
      RouteKey: 'POST /auth/register'
      Target: !Sub 'integrations/${AuthIntegration}'
      AuthorizationType: NONE
  AuthLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MediSlotHttpApi
      RouteKey: 'POST /auth/login'
      Target: !Sub 'integrations/${AuthIntegration}'
      AuthorizationType: NONE
  AuthRefreshRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MediSlotHttpApi
      RouteKey: 'POST /auth/refresh'
      Target: !Sub 'integrations/${AuthIntegration}'
      AuthorizationType: NONE
  AuthLogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MediSlotHttpApi
      RouteKey: 'POST /auth/logout'
      Target: !Sub 'integrations/${AuthIntegration}'
      AuthorizationType: NONE

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MediSlotHttpApi
      StageName: '$default'
      AutoDeploy: true
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotHttpApi}/authorizers/${MediSlotLambdaAuthorizer}'

  AuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotHttpApi}/*/*'

Outputs:
  ApiId:
    Description: MediSlot HTTP API ID
    Value: !Ref MediSlotHttpApi
  ApiEndpoint:
    Description: Base URL of the MediSlot API
    Value: !GetAtt MediSlotHttpApi.ApiEndpoint
  AuthRegisterEndpoint:
    Value: !Sub '${MediSlotHttpApi.ApiEndpoint}/auth/register'
  AuthLoginEndpoint:
    Value: !Sub '${MediSlotHttpApi.ApiEndpoint}/auth/login'
  AuthRefreshEndpoint:
    Value: !Sub '${MediSlotHttpApi.ApiEndpoint}/auth/refresh'
  AuthLogoutEndpoint:
    Value: !Sub '${MediSlotHttpApi.ApiEndpoint}/auth/logout'
