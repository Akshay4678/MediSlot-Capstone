name: MediSlot AWS Deployment

on:
  push:
    branches:
      - milestone-2-branch

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: medislot-deployment-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    # Allows environment-specific GitHub variables for dev, test, and prod.
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    if: github.ref == 'refs/heads/milestone-2-branch'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: medislot
      ENVIRONMENT_NAME: ${{ github.event.inputs.environment || 'dev' }}

    steps:

      # ==========================================
      # STEP 1: Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # STEP 2: Check deployment configuration
      # ==========================================
      - name: Check deployment configuration and files
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" || "${AWS_REGION}" == "None" ]]; then
            echo "::error::Set the AWS_REGION repository variable."
            exit 1
          fi

          if [[ -z "${AWS_ROLE_ARN:-}" ]]; then
            echo "::error::Set the AWS_ROLE_ARN repository secret."
            exit 1
          fi

          case "${ENVIRONMENT_NAME}" in
            dev|test|prod) ;;
            *)
              echo "::error::Invalid environment: ${ENVIRONMENT_NAME}"
              exit 1
              ;;
          esac

          for template in \
            infrastructure/cloudformation/network.yaml \
            infrastructure/cloudformation/rds.yaml \
            infrastructure/cloudformation/dynamodb.yaml \
            infrastructure/cloudformation/auth.yaml \
            infrastructure/cloudformation/api.yaml
          do
            if [[ ! -f "${template}" ]]; then
              echo "::error::CloudFormation template not found: ${template}"
              exit 1
            fi
          done

          if [[ ! -d "application" ]]; then
            echo "::error::The application/ directory was not found."
            exit 1
          fi

          if [[ ! -f "requirements-auth.txt" ]]; then
            echo "::error::requirements-auth.txt was not found."
            exit 1
          fi

          echo "Project: ${PROJECT_NAME}"
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Region: ${AWS_REGION}"
          echo "Branch: ${GITHUB_REF_NAME}"

      # ==========================================
      # STEP 3: Configure AWS credentials using OIDC
      # ==========================================
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MediSlotGitHubActions

      # ==========================================
      # STEP 4: Verify AWS connection
      # ==========================================
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ==========================================
      # STEP 5: Validate CloudFormation templates
      # ==========================================
      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/cloudformation/network.yaml \
            infrastructure/cloudformation/rds.yaml \
            infrastructure/cloudformation/dynamodb.yaml \
            infrastructure/cloudformation/auth.yaml \
            infrastructure/cloudformation/api.yaml
          do
            echo "Validating ${template}"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "${AWS_REGION}" >/dev/null

            echo "Validation passed: ${template}"
          done

      # ==========================================
      # STEP 6: Deploy Network Stack
      # ==========================================
      - name: Deploy Network Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-network"

          echo "Deploying Network Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/network.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "EnableNatGateway=false" \
              "EnableS3GatewayEndpoint=true" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

      # ==========================================
      # STEP 7: Read Network Stack outputs for RDS
      # ==========================================
      - name: Read Network Stack Outputs
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-network"

          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue | [0]" \
              --output text \
              --region "${AWS_REGION}"
          }

          DB_SUBNET_1="$(get_output PrivateDbSubnet1Id)"
          DB_SUBNET_2="$(get_output PrivateDbSubnet2Id)"
          DB_SECURITY_GROUP_ID="$(get_output DatabaseSecurityGroupId)"

          # Lambda VPC settings come from CloudFormation, not GitHub variables.
          LAMBDA_SUBNET_1_ID="$(get_output PrivateAppSubnet1Id)"
          LAMBDA_SUBNET_2_ID="$(get_output PrivateAppSubnet2Id)"
          LAMBDA_SECURITY_GROUP_ID="$(get_output AppSecurityGroupId)"

          for name in DB_SUBNET_1 DB_SUBNET_2 DB_SECURITY_GROUP_ID LAMBDA_SUBNET_1_ID LAMBDA_SUBNET_2_ID LAMBDA_SECURITY_GROUP_ID; do
            value="${!name}"

            if [[ -z "${value}" || "${value}" == "None" ]]; then
              echo "::error::Required network output '${name}' is missing."
              exit 1
            fi
          done

          {
            echo "DB_SUBNET_1=${DB_SUBNET_1}"
            echo "DB_SUBNET_2=${DB_SUBNET_2}"
            echo "DB_SECURITY_GROUP_ID=${DB_SECURITY_GROUP_ID}"
            echo "LAMBDA_SUBNET_1_ID=${LAMBDA_SUBNET_1_ID}"
            echo "LAMBDA_SUBNET_2_ID=${LAMBDA_SUBNET_2_ID}"
            echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP_ID}"
          } >> "${GITHUB_ENV}"

          echo "Database network configuration loaded."

      # ==========================================
      # STEP 8: Deploy RDS and Data Stack
      # ==========================================
      - name: Deploy RDS and Data Stack
        shell: bash
        env:
          DB_USERNAME_INPUT: ${{ vars.MEDISLOT_DB_USERNAME }}
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-data"

          DB_USERNAME="${DB_USERNAME_INPUT:-medislot_admin}"
          DB_NAME="medislot"

          if [[ "${ENVIRONMENT_NAME}" == "prod" ]]; then
            DELETION_PROTECTION=true
          else
            DELETION_PROTECTION=false
          fi

          echo "Deploying Data Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/rds.yaml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "PrivateDbSubnet1Id=${DB_SUBNET_1}" \
              "PrivateDbSubnet2Id=${DB_SUBNET_2}" \
              "DatabaseSecurityGroupId=${DB_SECURITY_GROUP_ID}" \
              "DBName=${DB_NAME}" \
              "DBUsername=${DB_USERNAME}" \
              "EnableDeletionProtection=${DELETION_PROTECTION}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"


      # ==========================================
      # STEP 8A: Deploy Authentication DynamoDB Tables
      # ==========================================
      - name: Deploy Authentication DynamoDB Tables
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-dynamodb"

          echo "Deploying DynamoDB Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/dynamodb.yaml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

          echo "Authentication DynamoDB tables deployed."

      # ==========================================
      # STEP 9: Read deployment bucket from Data Stack
      # ==========================================
      - name: Read Lambda artifacts bucket from Data Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-data"

          LAMBDA_ARTIFACTS_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          if [[ -z "${LAMBDA_ARTIFACTS_BUCKET}" || "${LAMBDA_ARTIFACTS_BUCKET}" == "None" ]]; then
            echo "::error::ArtifactsBucketName output was not found in ${STACK_NAME}."
            exit 1
          fi

          # Ensure the bucket exists and the current role can access it.
          aws s3api head-bucket \
            --bucket "${LAMBDA_ARTIFACTS_BUCKET}" \
            --region "${AWS_REGION}"

          # Read database connection outputs required by api.yaml.
          DB_HOST="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpointAddress'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          DB_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          DB_SECRET_ARN="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='DBSecretArn'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          IDEMPOTENCY_TABLE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='IdempotencyTableName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          SLOT_CAPACITY_TABLE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SlotCapacityTableName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          WAITLIST_TABLE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='WaitlistTableName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          NOTIFICATION_DISPATCH_TABLE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='NotificationDispatchTableName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          # Read authentication state table names from the DynamoDB stack.
          AUTH_DDB_STACK="${PROJECT_NAME}-${ENVIRONMENT_NAME}-dynamodb"

          REFRESH_TOKEN_TABLE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${AUTH_DDB_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='RefreshTokenTableName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          TOKEN_DENYLIST_TABLE_NAME="$(aws cloudformation describe-stacks \
            --stack-name "${AUTH_DDB_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='TokenDenylistTableName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          for name in DB_HOST DB_NAME DB_SECRET_ARN IDEMPOTENCY_TABLE_NAME SLOT_CAPACITY_TABLE_NAME WAITLIST_TABLE_NAME NOTIFICATION_DISPATCH_TABLE_NAME REFRESH_TOKEN_TABLE_NAME TOKEN_DENYLIST_TABLE_NAME; do
            value="${!name}"
            if [[ -z "${value}" || "${value}" == "None" ]]; then
              echo "::error::Required Data Stack output '${name}' is missing from ${STACK_NAME}."
              exit 1
            fi
          done

          {
            echo "LAMBDA_ARTIFACTS_BUCKET=${LAMBDA_ARTIFACTS_BUCKET}"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_SECRET_ARN=${DB_SECRET_ARN}"
            echo "IDEMPOTENCY_TABLE_NAME=${IDEMPOTENCY_TABLE_NAME}"
            echo "SLOT_CAPACITY_TABLE_NAME=${SLOT_CAPACITY_TABLE_NAME}"
            echo "WAITLIST_TABLE_NAME=${WAITLIST_TABLE_NAME}"
            echo "NOTIFICATION_DISPATCH_TABLE_NAME=${NOTIFICATION_DISPATCH_TABLE_NAME}"
            echo "REFRESH_TOKEN_TABLE_NAME=${REFRESH_TOKEN_TABLE_NAME}"
            echo "TOKEN_DENYLIST_TABLE_NAME=${TOKEN_DENYLIST_TABLE_NAME}"
          } >> "${GITHUB_ENV}"

          echo "Using artifacts bucket from Data Stack: ${LAMBDA_ARTIFACTS_BUCKET}"
          echo "Database connection outputs loaded from Data Stack."

      # ==========================================
      # STEP 9A: Create/update SSM Parameter Store values
      # ==========================================
      - name: Configure Systems Manager Parameter Store
        shell: bash
        run: |
          set -euo pipefail

          JWT_PARAMETER="/${PROJECT_NAME}/${ENVIRONMENT_NAME}/auth/jwt-secret"
          DB_HOST_PARAMETER="/${PROJECT_NAME}/${ENVIRONMENT_NAME}/database/host"
          DB_SECRET_ARN_PARAMETER="/${PROJECT_NAME}/${ENVIRONMENT_NAME}/database/secret-arn"
          DB_NAME_PARAMETER="/${PROJECT_NAME}/${ENVIRONMENT_NAME}/database/name"

          echo "Configuring non-secret database parameters in SSM Parameter Store..."

          aws ssm put-parameter \
            --name "${DB_HOST_PARAMETER}" \
            --type String \
            --value "${DB_HOST}" \
            --overwrite \
            --region "${AWS_REGION}" >/dev/null

          aws ssm put-parameter \
            --name "${DB_SECRET_ARN_PARAMETER}" \
            --type String \
            --value "${DB_SECRET_ARN}" \
            --overwrite \
            --region "${AWS_REGION}" >/dev/null

          aws ssm put-parameter \
            --name "${DB_NAME_PARAMETER}" \
            --type String \
            --value "${DB_NAME}" \
            --overwrite \
            --region "${AWS_REGION}" >/dev/null

          # Preserve an existing JWT secret so deployments do not invalidate
          # tokens. Create it only when the parameter does not yet exist.
          if aws ssm get-parameter \
              --name "${JWT_PARAMETER}" \
              --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "JWT secret already exists; preserving the existing value."
          else
            # Generate a strong secret only on first deployment. The parameter
            # is preserved on later deployments so existing JWTs remain valid.
            JWT_SECRET_GENERATED="$(openssl rand -hex 32)"

            aws ssm put-parameter \
              --name "${JWT_PARAMETER}" \
              --type SecureString \
              --value "${JWT_SECRET_GENERATED}" \
              --description "MediSlot ${ENVIRONMENT_NAME} JWT signing secret" \
              --region "${AWS_REGION}" >/dev/null

            unset JWT_SECRET_GENERATED
            echo "Created JWT SecureString parameter using a generated secret."
          fi

          echo "SSM Parameter Store configuration completed."
          echo "JWT secret value was not printed."

      # ==========================================
      # STEP 10: Deploy Authentication Stack
      # ==========================================
      - name: Deploy Authentication Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-auth"

          echo "Deploying Authentication Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/auth.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"


          
      # ==========================================
      # STEP 11: Package Python Lambda code
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda code
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="${RUNNER_TEMP}/lambda-package"
          ZIP_FILE="${RUNNER_TEMP}/medislot-lambda.zip"
          rm -rf "${PACKAGE_DIR}"
          mkdir -p "${PACKAGE_DIR}"
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-auth.txt --target "${PACKAGE_DIR}"
          mkdir -p "${PACKAGE_DIR}/application/auth" "${PACKAGE_DIR}/application/authorizer" "${PACKAGE_DIR}/application/common" "${PACKAGE_DIR}/application/database"
          cp application/__init__.py "${PACKAGE_DIR}/application/__init__.py"
          cp application/auth/__init__.py application/auth/handler.py application/auth/register.py application/auth/login.py application/auth/refresh.py application/auth/logout.py "${PACKAGE_DIR}/application/auth/"
          cp application/authorizer/__init__.py application/authorizer/lambda_handler.py "${PACKAGE_DIR}/application/authorizer/"
          cp application/common/__init__.py application/common/auth_utils.py application/common/http.py "${PACKAGE_DIR}/application/common/"
          cp application/database/__init__.py application/database/connection.py "${PACKAGE_DIR}/application/database/"
          ( cd "${PACKAGE_DIR}" && zip -qr "${ZIP_FILE}" . )
          test -s "${ZIP_FILE}"
          echo "Lambda package created successfully."

      # ==========================================
      # STEP 12: Upload Lambda ZIP to S3
      # ==========================================
      - name: Upload Lambda package to S3
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${RUNNER_TEMP}/medislot-lambda.zip"

          S3_KEY="lambda/${ENVIRONMENT_NAME}/${GITHUB_SHA}/medislot-lambda.zip"

          echo "Uploading Lambda package..."

          aws s3 cp \
            "${ZIP_FILE}" \
            "s3://${LAMBDA_ARTIFACTS_BUCKET}/${S3_KEY}" \
            --region "${AWS_REGION}"

          {
            echo "LAMBDA_CODE_S3_BUCKET=${LAMBDA_ARTIFACTS_BUCKET}"
            echo "LAMBDA_CODE_S3_KEY=${S3_KEY}"
          } >> "${GITHUB_ENV}"

          echo "Lambda package uploaded."
          echo "S3 key: ${S3_KEY}"

      # ==========================================
      # STEP 13A: Repair API stack if Lambda functions were deleted outside CloudFormation
      # ==========================================
      # CloudFormation cannot UPDATE a Lambda function that no longer exists in AWS.
      # If any expected function is missing while the API stack still exists, delete
      # only the API stack so the next step can create its resources cleanly.
      # Network, RDS, DynamoDB, SSM parameters, and IAM stacks are not deleted here.
      - name: Repair API stack if Lambda functions are missing
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-api"
          EXPECTED_FUNCTIONS=(
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-auth"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-authorizer"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-doctor-search"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-doctor"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-patient"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-availability"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-booking"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-appointment"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-reschedule"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-waitlist"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-notification"
            "${PROJECT_NAME}-${ENVIRONMENT_NAME}-reporting"
          )

          if ! aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "API stack does not exist; the deployment step will create it."
            exit 0
          fi

          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text \
            --region "${AWS_REGION}")"

          echo "Current API stack status: ${STACK_STATUS}"

          MISSING_FUNCTIONS=0
          for FUNCTION_NAME in "${EXPECTED_FUNCTIONS[@]}"; do
            if ! aws lambda get-function \
                --function-name "${FUNCTION_NAME}" \
                --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "Lambda function is missing: ${FUNCTION_NAME}"
              MISSING_FUNCTIONS=1
            fi
          done

          if [[ "${MISSING_FUNCTIONS}" -eq 1 ]]; then
            case "${STACK_STATUS}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|UPDATE_ROLLBACK_FAILED|CREATE_FAILED|ROLLBACK_COMPLETE)
                echo "Deleting only the inconsistent API stack so CloudFormation can recreate its missing Lambda resources."
                aws cloudformation delete-stack \
                  --stack-name "${STACK_NAME}" \
                  --region "${AWS_REGION}"
                aws cloudformation wait stack-delete-complete \
                  --stack-name "${STACK_NAME}" \
                  --region "${AWS_REGION}"
                echo "Inconsistent API stack deleted. The next step will recreate it."
                ;;
              *)
                echo "::error::API stack is in '${STACK_STATUS}'. Wait for CloudFormation to finish or resolve this stack state before retrying."
                exit 1
                ;;
            esac
          else
            echo "Both Lambda functions exist; keeping the current API stack."
          fi

      # ==========================================
      # STEP 13: Deploy API Gateway and Lambda Stack
      # ==========================================
      - name: Deploy API and Lambda Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-api"

          echo "Deploying API Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/api.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaCodeS3Bucket=${LAMBDA_CODE_S3_BUCKET}" \
              "LambdaCodeS3Key=${LAMBDA_CODE_S3_KEY}" \
              "LambdaSubnetIds=${LAMBDA_SUBNET_1_ID},${LAMBDA_SUBNET_2_ID}" \
              "LambdaSecurityGroupId=${LAMBDA_SECURITY_GROUP_ID}" \
              "TokenDenylistTableName=${TOKEN_DENYLIST_TABLE_NAME}" \
              "RefreshTokenTableName=${REFRESH_TOKEN_TABLE_NAME}" \
              "DatabaseHost=${DB_HOST}" \
              "DatabaseName=${DB_NAME}" \
              "DatabaseSecretArn=${DB_SECRET_ARN}" \
              "JwtSecretParameterName=/${PROJECT_NAME}/${ENVIRONMENT_NAME}/auth/jwt-secret" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

          echo "API Stack deployed successfully."

      # ==========================================
      # STEP 13B: Initialize the RDS MySQL schema through a temporary VPC Lambda
      # The GitHub-hosted runner cannot directly connect to private RDS.
      # This function reuses the VPC settings and execution role of the auth Lambda.
      # ==========================================
      - name: Initialize RDS MySQL schema
        shell: bash
        run: |
          set -euo pipefail

          AUTH_FUNCTION="${PROJECT_NAME}-${ENVIRONMENT_NAME}-auth"
          BOOTSTRAP_FUNCTION="${PROJECT_NAME}-${ENVIRONMENT_NAME}-schema-bootstrap-${GITHUB_RUN_ID}"
          PACKAGE_DIR="${RUNNER_TEMP}/schema-bootstrap-package"
          ZIP_FILE="${RUNNER_TEMP}/schema-bootstrap.zip"
          PAYLOAD_FILE="${RUNNER_TEMP}/schema-bootstrap-payload.json"
          RESPONSE_FILE="${RUNNER_TEMP}/schema-bootstrap-response.json"

          cleanup() {
            aws lambda delete-function --function-name "${BOOTSTRAP_FUNCTION}" --region "${AWS_REGION}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if [[ ! -f application/database/schema.sql ]]; then
            echo "::error::application/database/schema.sql was not found."
            exit 1
          fi

          # Reuse the existing auth Lambda's role and VPC configuration so the
          # bootstrap function can read the DB secret and reach private RDS.
          AUTH_CONFIG="$(aws lambda get-function-configuration --function-name "${AUTH_FUNCTION}" --region "${AWS_REGION}")"
          ROLE_ARN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("Role", ""))' <<< "${AUTH_CONFIG}")"
          SUBNET_IDS="$(python -c 'import json,sys; d=json.load(sys.stdin); print(",".join(d.get("VpcConfig",{}).get("SubnetIds",[])))' <<< "${AUTH_CONFIG}")"
          SECURITY_GROUP_IDS="$(python -c 'import json,sys; d=json.load(sys.stdin); print(",".join(d.get("VpcConfig",{}).get("SecurityGroupIds",[])))' <<< "${AUTH_CONFIG}")"

          if [[ -z "${ROLE_ARN}" || -z "${SUBNET_IDS}" || -z "${SECURITY_GROUP_IDS}" ]]; then
            echo "::error::Auth Lambda must have an execution role, VPC subnets, and security groups to initialize private RDS."
            exit 1
          fi

          rm -rf "${PACKAGE_DIR}"
          mkdir -p "${PACKAGE_DIR}/application/database"
          python -m pip install --requirement requirements-auth.txt --target "${PACKAGE_DIR}"
          cp application/__init__.py "${PACKAGE_DIR}/application/__init__.py"
          cp application/database/__init__.py application/database/connection.py "${PACKAGE_DIR}/application/database/"
          cp application/database/schema.sql "${PACKAGE_DIR}/application/database/schema.sql"
          cp application/database/init_schema.py "${PACKAGE_DIR}/application/database/init_schema.py"
          ( cd "${PACKAGE_DIR}" && zip -qr "${ZIP_FILE}" . )

          aws lambda create-function \
            --function-name "${BOOTSTRAP_FUNCTION}" \
            --runtime python3.12 \
            --handler application.database.init_schema.lambda_handler \
            --role "${ROLE_ARN}" \
            --timeout 120 \
            --memory-size 256 \
            --zip-file "fileb://${ZIP_FILE}" \
            --vpc-config "SubnetIds=${SUBNET_IDS},SecurityGroupIds=${SECURITY_GROUP_IDS}" \
            --environment "Variables={DB_HOST=${DB_HOST},DB_NAME=${DB_NAME},DATABASE_SECRET_ARN=${DB_SECRET_ARN},DB_PORT=3306}" \
            --region "${AWS_REGION}" >/dev/null

          aws lambda wait function-active-v2 \
            --function-name "${BOOTSTRAP_FUNCTION}" \
            --region "${AWS_REGION}"

          printf '{}' > "${PAYLOAD_FILE}"
          aws lambda invoke \
            --function-name "${BOOTSTRAP_FUNCTION}" \
            --invocation-type RequestResponse \
            --payload "fileb://${PAYLOAD_FILE}" \
            --cli-binary-format raw-in-base64-out \
            "${RESPONSE_FILE}" \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/schema-bootstrap-invoke-metadata.json"

          cat "${RESPONSE_FILE}"
          if grep -q '"FunctionError"' "${RUNNER_TEMP}/schema-bootstrap-invoke-metadata.json"; then
            echo "::error::Schema initialization Lambda failed. See its CloudWatch log stream for details."
            exit 1
          fi
          echo "RDS schema initialization completed successfully."

      # ==========================================
      # STEP 14: Display API endpoint
      # ==========================================
      - name: Display API endpoint
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-api"

          API_ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          if [[ -z "${API_ENDPOINT}" || "${API_ENDPOINT}" == "None" ]]; then
            echo "::error::ApiEndpoint output was not found."
            exit 1
          fi

          echo "========================================"
          echo "MediSlot API Deployment"
          echo "========================================"
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "API endpoint: ${API_ENDPOINT}"
          echo ""
          echo "Base API endpoint: ${API_ENDPOINT}"
          echo "Exact routes are defined by infrastructure/cloudformation/api.yaml."

      # ==========================================
      # STEP 15: Display deployment status
      # ==========================================
      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "MediSlot CloudFormation Deployment"
          echo "========================================"

          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Region: ${AWS_REGION}"

          for stack in network data dynamodb auth api; do
            stack_name="${PROJECT_NAME}-${ENVIRONMENT_NAME}-${stack}"

            echo ""
            echo "Stack: ${stack_name}"

            aws cloudformation describe-stacks \
              --stack-name "${stack_name}" \
              --query "Stacks[0].StackStatus" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null \
              || echo "Stack does not exist or could not be described."
          done