AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Flask doctor and patient dashboards on one EC2 instance.

Parameters:
  ProjectName:
    Type: String
    Default: medislot

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id

  ArtifactsBucketName:
    Type: String
    Description: S3 bucket containing the packaged web application.

  WebPackageKey:
    Type: String
    Description: S3 key of the web application ZIP.

  ApiBaseUrl:
    Type: String
    Description: API Gateway base URL including the stage.

  SsmEndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the Systems Manager interface endpoints.

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MediSlot web application HTTP access
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP dashboard access
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebToSsmEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SsmEndpointSecurityGroupId
      Description: Allow HTTPS from MediSlot web EC2 to SSM endpoints
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref WebSecurityGroup

  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-web-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: MediSlotWebRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWebPackage
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucketName}/web/*'

              - Sid: ReadWebSettings
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/web/*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-instance-role'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebInstanceRole

  WebInstanceV2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref WebInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

      # How a new release reaches the instance:
      #  - CloudFormation changes UserData (new WebPackageKey) -> the instance is stopped and started.
      #  - cloud-init does NOT re-run user-data on a restart, but it DOES run scripts in
      #    /var/lib/cloud/scripts/per-boot on every boot.
      #  - The per-boot script reads the current package key from the instance's own user-data
      #    (the "# MEDISLOT_..." marker lines below), so it always installs the newest package.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # MEDISLOT_WEB_PACKAGE_KEY=${WebPackageKey}
          # MEDISLOT_API_BASE_URL=${ApiBaseUrl}
          set -Eeuo pipefail

          install -d -m 0755 /var/lib/cloud/scripts/per-boot

          cat > /var/lib/cloud/scripts/per-boot/medislot-deploy.sh <<'DEPLOYEOF'
          #!/bin/bash
          set -Eeuo pipefail

          exec > >(tee -a /var/log/medislot-bootstrap.log) 2>&1

          echo "Starting MediSlot deploy: $(date -Is)"

          REGION='${AWS::Region}'
          BUCKET='${ArtifactsBucketName}'

          # Read the current release settings from this instance's user-data (IMDSv2).
          imds_token() {
            curl -fsS -X PUT http://169.254.169.254/latest/api/token \
              -H 'X-aws-ec2-metadata-token-ttl-seconds: 60'
          }

          userdata_value() {
            curl -fsS -H "X-aws-ec2-metadata-token: $(imds_token)" \
              http://169.254.169.254/latest/user-data \
              | sed -n "s/^# $1=//p" | head -n 1
          }

          PACKAGE_KEY="$(userdata_value MEDISLOT_WEB_PACKAGE_KEY)"
          API_BASE_URL="$(userdata_value MEDISLOT_API_BASE_URL)"

          if [ -z "$PACKAGE_KEY" ] || [ -z "$API_BASE_URL" ]; then
            echo "Could not read release settings from instance user-data."
            exit 1
          fi

          echo "Deploying package: $PACKAGE_KEY"

          # Operating system packages (python3 and curl are already on Amazon Linux 2023).
          rpm -q python3 unzip >/dev/null 2>&1 || dnf install -y python3 unzip

          # Application user and directory.
          id medislot >/dev/null 2>&1 || \
            useradd --system --home-dir /opt/medislot --shell /sbin/nologin medislot

          install -d -o medislot -g medislot -m 0755 /opt/medislot

          # Stop the old version and clear old files so nothing stale remains.
          systemctl stop medislot-web.service 2>/dev/null || true
          find /opt/medislot -mindepth 1 -delete

          # Download and extract the exact release package.
          rm -f /tmp/medislot-web.zip
          aws s3 cp "s3://$BUCKET/$PACKAGE_KEY" /tmp/medislot-web.zip --region "$REGION"
          test -s /tmp/medislot-web.zip
          python3 -m zipfile -e /tmp/medislot-web.zip /opt/medislot

          # Verify the package structure (requirements.txt lives inside web/).
          test -f /opt/medislot/app.py
          test -f /opt/medislot/web/app.py
          test -f /opt/medislot/web/requirements.txt
          test -f /opt/medislot/web/templates/login.html
          test -d /opt/medislot/vendor

          # Verify the shipped template contains the CSRF field.
          grep -q 'csrf_token' /opt/medislot/web/templates/login.html

          # Verify dependencies with the EC2 Python runtime.
          export PYTHONPATH=/opt/medislot/vendor:/opt/medislot
          python3 -c "import flask, gunicorn, requests, boto3; print('MediSlot dependencies verified successfully')"

          chown -R medislot:medislot /opt/medislot
          chmod -R a+rX /opt/medislot

          # Application environment.
          cat > /etc/medislot-web.env <<ENVEOF
          API_BASE_URL=$API_BASE_URL
          AWS_DEFAULT_REGION=$REGION
          SECRET_KEY_PARAMETER=/${ProjectName}/${EnvironmentName}/web/flask-secret-key
          PYTHONPATH=/opt/medislot/vendor:/opt/medislot
          ENVEOF

          chown root:medislot /etc/medislot-web.env
          chmod 0640 /etc/medislot-web.env

          # systemd service.
          cat > /etc/systemd/system/medislot-web.service <<'UNITEOF'
          [Unit]
          Description=MediSlot Flask Web Application
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=medislot
          Group=medislot
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/etc/medislot-web.env

          ExecStart=/usr/bin/python3 -m gunicorn \
            --workers 1 \
            --threads 8 \
            --timeout 60 \
            --bind 0.0.0.0:80 \
            --access-logfile - \
            --error-logfile - \
            app:app

          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true

          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNITEOF

          systemctl daemon-reload
          systemctl enable medislot-web.service
          systemctl restart medislot-web.service

          # Local health check.
          healthy=0

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1/healthz; then
              healthy=1
              echo
              echo "MediSlot health check passed."
              break
            fi

            echo "Health check attempt $attempt/30 failed."
            sleep 3
          done

          if [ "$healthy" -ne 1 ]; then
            echo "MediSlot application failed to start."
            systemctl status medislot-web.service --no-pager || true
            journalctl -u medislot-web.service -n 100 --no-pager || true
            exit 1
          fi

          echo "MediSlot deploy completed: $(date -Is) package=$PACKAGE_KEY"
          DEPLOYEOF

          chmod 0755 /var/lib/cloud/scripts/per-boot/medislot-deploy.sh

          # First boot: run it now. Later boots run it through cloud-init's per-boot hook.
          /var/lib/cloud/scripts/per-boot/medislot-deploy.sh

  WebElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-eip'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt WebElasticIp.AllocationId
      InstanceId: !Ref WebInstanceV2

Outputs:
  WebUrl:
    Description: Public URL of the MediSlot web application.
    Value: !Sub 'http://${WebElasticIp}'

  WebInstanceId:
    Description: EC2 instance hosting the MediSlot dashboards.
    Value: !Ref WebInstanceV2

  WebSecurityGroupId:
    Description: Security group attached to the web instance.
    Value: !Ref WebSecurityGroup