AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot authentication state and Milestone 3 materialised slot tables

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  RefreshTokenTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-refresh-tokens-m3'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TokenActiveListTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-token-activelist-m3'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  MaterialisedSlotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-materialised-slots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S
      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  RefreshTokenTableName:
    Description: DynamoDB refresh token table name
    Value: !Ref RefreshTokenTable
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-RefreshTokenTableName'
  RefreshTokenTableArn:
    Description: DynamoDB refresh token table ARN
    Value: !GetAtt RefreshTokenTable.Arn
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-RefreshTokenTableArn'
  TokenActiveListTableName:
    Description: DynamoDB token active-list table name
    Value: !Ref TokenActiveListTable
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-TokenActiveListTableName'
  TokenActiveListTableArn:
    Description: DynamoDB token active-list table ARN
    Value: !GetAtt TokenActiveListTable.Arn
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-TokenActiveListTableArn'

  MaterialisedSlotsTableName:
    Description: DynamoDB materialised slot capacity table
    Value: !Ref MaterialisedSlotsTable
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-MaterialisedSlotsTableName'
  MaterialisedSlotsTableArn:
    Value: !GetAtt MaterialisedSlotsTable.Arn
    Export:
      Name: !Sub '${EnvironmentName}-MediSlot-MaterialisedSlotsTableArn'
