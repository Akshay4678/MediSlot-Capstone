name: MediSlot CI

on:
  push:
    branches:
      - milestone-2-branch
  pull_request:
    branches:
      - milestone-2-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloudformation:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint
      - name: Validate Network Stack
        run: cfn-lint infrastructure/cloudformation/network.yaml
      - name: Validate RDS and Data Stack
        run: cfn-lint infrastructure/cloudformation/rds.yaml
      - name: Validate Authentication and Milestone 3 Stacks
        run: |
          cfn-lint infrastructure/cloudformation/auth.yaml \
            infrastructure/cloudformation/dynamodb.yaml \
            infrastructure/cloudformation/api.yaml \
            infrastructure/cloudformation/scheduler.yaml \
            infrastructure/cloudformation/web.yaml

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 PyMySQL bcrypt PyJWT
      - name: Compile Python source
        run: python -m compileall -q application tests
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/unit -v
