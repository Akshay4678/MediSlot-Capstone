AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Milestone 2 IAM roles for authentication and RDS connectivity testing.
Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  JwtSecretParameterArn:
    Type: String
  RefreshTokenTableArn:
    Type: String
  TokenDenylistTableArn:
    Type: String
  DatabaseSecretArn:
    Type: String
Resources:
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-medislot-auth-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: AuthMilestone2Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Ref JwtSecretParameterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !Ref RefreshTokenTableArn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !Ref TokenDenylistTableArn
  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-medislot-authorizer-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuthorizerMilestone2Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Ref JwtSecretParameterArn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref TokenDenylistTableArn
  RdsConnectivityTestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-medislot-rds-test-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadDbCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
Outputs:
  AuthLambdaRoleArn:
    Value: !GetAtt AuthLambdaRole.Arn
    Export: {Name: !Sub '${EnvironmentName}-MediSlot-AuthLambdaRoleArn'}
  AuthorizerLambdaRoleArn:
    Value: !GetAtt AuthorizerLambdaRole.Arn
    Export: {Name: !Sub '${EnvironmentName}-MediSlot-AuthorizerLambdaRoleArn'}
  RdsConnectivityTestRoleArn:
    Value: !GetAtt RdsConnectivityTestRole.Arn
    Export: {Name: !Sub '${EnvironmentName}-MediSlot-RdsConnectivityTestRoleArn'}
