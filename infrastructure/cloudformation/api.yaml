AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot API - REST API Gateway, JWT Lambda Authorizer, auth Lambdas and doctor-domain routes.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LambdaCodeS3Bucket:
    Type: String
    Description: Private S3 bucket containing the Lambda deployment ZIP.
  LambdaCodeS3Key:
    Type: String
    Description: S3 object key of the Lambda deployment ZIP.
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseSecretArn:
    Type: String
  DatabaseHost:
    Type: String
  DatabaseName:
    Type: String
    Default: medislot
  JwtSecretParameterName:
    Type: String
  RefreshTokenTableName:
    Type: String
  TokenActiveListTableName:
    Type: String

Resources:
  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-auth'
      Runtime: python3.12
      Handler: application.auth.handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AuthLambdaExecutionRoleArn'
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Timeout: 25
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          SSM_PREFIX: !Sub '/${ProjectName}/${EnvironmentName}'
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          JWT_ISSUER: medislot
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DB_HOST: !Ref DatabaseHost
          DB_NAME: !Ref DatabaseName
          REFRESH_TOKEN_TABLE: !Ref RefreshTokenTableName
          TOKEN_ACTIVELIST_TABLE: !Ref TokenActiveListTableName
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-authorizer'
      Runtime: python3.12
      Handler: application.authorizer.lambda_handler.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-AuthorizerLambdaExecutionRoleArn'
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          JWT_SECRET_PARAMETER_NAME: !Ref JwtSecretParameterName
          JWT_ISSUER: medislot
          TOKEN_ACTIVELIST_TABLE: !Ref TokenActiveListTableName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  MediSlotRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-rest-api'
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  BodyValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: validate-body
      ValidateRequestBody: true
      ValidateRequestParameters: false

  MediSlotAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-jwt-authorizer'
      RestApiId: !Ref MediSlotRestApi
      Type: REQUEST
      IdentitySource: method.request.header.Authorization
      # TTL 0 on purpose: the active-token check (one token per user, removed on logout or
      # when a new token is issued) must take effect immediately. Cost: one strongly
      # consistent DynamoDB GetItem per request.
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotRestApi}/authorizers/${MediSlotAuthorizer}'

  AuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotRestApi}/*/*/auth/*'

  DoctorApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotRestApi}/*/*/*'

  LoginModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: LoginRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["email", "password"], "properties": {"email": {"type": "string"}, "password": {"type": "string"}}}

  RegisterPatientModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: RegisterPatientRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["email", "password", "first_name", "last_name"], "properties": {"email": {"type": "string"}, "password": {"type": "string"}, "first_name": {"type": "string"}, "last_name": {"type": "string"}, "phone": {"type": "string"}}}

  RegisterDoctorModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: RegisterDoctorRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["email", "password"], "properties": {"email": {"type": "string"}, "password": {"type": "string"}, "registration_code": {"type": "string"}}}

  RefreshModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: RefreshRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["refresh_token"], "properties": {"refresh_token": {"type": "string"}}}

  PhotoModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: PhotoRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["content_type"], "properties": {"content_type": {"type": "string"}}}

  BlackoutModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: BlackoutRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["blackout_date"], "properties": {"blackout_date": {"type": "string"}, "reason": {"type": "string"}}}

  ConsultationTypeModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Name: ConsultationTypeRequest
      ContentType: application/json
      Schema: {"$schema": "http://json-schema.org/draft-04/schema#", "type": "object", "required": ["type_name", "fee"], "properties": {"type_name": {"type": "string"}, "fee": {"type": ["number", "string"]}, "duration_minutes": {"type": ["integer", "string"]}}}

  AuthRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: 'auth'

  AuthDoctorsRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthRes
      PathPart: 'doctors'

  AuthDoctorsRegisterRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthDoctorsRes
      PathPart: 'register'

  AuthDoctorsLoginRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthDoctorsRes
      PathPart: 'login'

  AuthPatientsRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthRes
      PathPart: 'patients'

  AuthPatientsRegisterRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthPatientsRes
      PathPart: 'register'

  AuthPatientsLoginRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthPatientsRes
      PathPart: 'login'

  AuthRefreshRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthRes
      PathPart: 'refresh'

  AuthLogoutRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthRes
      PathPart: 'logout'

  AuthTestTokenRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref AuthRes
      PathPart: 'test-token'

  DoctorsRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: 'doctors'

  DoctorsMeRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsRes
      PathPart: 'me'

  DoctorsMePhotoRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeRes
      PathPart: 'photo'

  DoctorsMeTypesRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeRes
      PathPart: 'consultation-types'

  DoctorsMeTypeRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeTypesRes
      PathPart: '{id}'

  DoctorsMeAvailabilityRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeRes
      PathPart: 'availability'

  DoctorsMeBlackoutsRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeRes
      PathPart: 'blackouts'

  DoctorsMeBlackoutRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeBlackoutsRes
      PathPart: '{id}'

  DoctorsMeScheduleRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !Ref DoctorsMeRes
      PathPart: 'schedule'

  HospitalsRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: 'hospitals'

  SpecialisationsRes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ParentId: !GetAtt MediSlotRestApi.RootResourceId
      PathPart: 'specialisations'

  DoctorRegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthDoctorsRegisterRes
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref RegisterDoctorModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  DoctorLoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthDoctorsLoginRes
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref LoginModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  PatientRegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthPatientsRegisterRes
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref RegisterPatientModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  PatientLoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthPatientsLoginRes
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref LoginModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthRefreshRes
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref RefreshModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthLogoutRes
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  TestTokenMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref AuthTestTokenRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'

  DoctorGetMeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  DoctorPutMeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeRes
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  DoctorPhotoMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMePhotoRes
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref PhotoModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  TypesListMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeTypesRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  TypesCreateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeTypesRes
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref ConsultationTypeModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  TypesUpdateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeTypeRes
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  TypesDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeTypeRes
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  AvailabilityGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeAvailabilityRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  AvailabilityPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeAvailabilityRes
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  BlackoutsListMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeBlackoutsRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  BlackoutsCreateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeBlackoutsRes
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref BlackoutModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  BlackoutsDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeBlackoutRes
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  ScheduleGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref DoctorsMeScheduleRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  HospitalsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref HospitalsRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  SpecialisationsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotRestApi
      ResourceId: !Ref SpecialisationsRes
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MediSlotAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunctionArn}/invocations'
          - DoctorFunctionArn:
              Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-DoctorApiFunctionArn'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [DoctorRegisterMethod, DoctorLoginMethod, PatientRegisterMethod, PatientLoginMethod, RefreshMethod, LogoutMethod, TestTokenMethod, DoctorGetMeMethod, DoctorPutMeMethod, DoctorPhotoMethod, TypesListMethod, TypesCreateMethod, TypesUpdateMethod, TypesDeleteMethod, AvailabilityGetMethod, AvailabilityPutMethod, BlackoutsListMethod, BlackoutsCreateMethod, BlackoutsDeleteMethod, ScheduleGetMethod, HospitalsGetMethod, SpecialisationsGetMethod]
    Properties:
      RestApiId: !Ref MediSlotRestApi
      Description: Initial deployment (the pipeline creates a fresh deployment on every release).

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MediSlotRestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref EnvironmentName
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ApiId:
    Description: REST API id (the pipeline creates a new deployment of this API on every release).
    Value: !Ref MediSlotRestApi
  ApiStageName:
    Value: !Ref ApiStage
  ApiEndpoint:
    Description: Base URL of the MediSlot API (includes the stage).
    Value: !Sub 'https://${MediSlotRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}'
