<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediSlot Doctor Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div><h1>MediSlot</h1><p>Doctor workspace · Milestone 3</p></div></header>
<section class="panel"><h2>Connect to your API</h2><label>API base URL<input id="apiBase" placeholder="https://xxxx.execute-api.ap-south-1.amazonaws.com"></label><label>Doctor access token<input id="token" type="password" placeholder="Paste Bearer token without the word Bearer"></label><button id="connect">Connect</button><p id="connection" class="muted">Not connected</p></section>
<section class="panel"><h2>Doctor profile</h2><form id="profileForm" class="grid">
<label>Hospital ID<input name="hospital_id" type="number" required></label><label>Specialisation ID<input name="specialisation_id" type="number" required></label>
<label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label>
<label>Licence number<input name="licence_number" required></label><label>Experience (years)<input name="experience_years" type="number" min="0" value="0"></label>
<label>Timezone<input name="timezone" value="Asia/Kolkata" required></label><label>Qualifications<input name="qualifications"></label>
<div class="actions"><button type="button" id="loadProfile">Load profile</button><button type="submit">Save profile</button></div></form>
<div class="inline"><label>Profile photo (JPEG/PNG/WebP, max 5 MB)<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="uploadPhoto" type="button">Upload photo</button></div><p id="profileStatus" class="muted"></p></section>
<section class="panel"><h2>Weekly availability</h2><form id="availabilityForm" class="grid"><label>Consultation type ID<input name="consultation_type_id" type="number" required></label><label>Day of week<select name="day_of_week"><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option><option value="7">Sunday</option></select></label><label>Start time<input name="start_time" type="time" value="09:00" required></label><label>End time<input name="end_time" type="time" value="17:00" required></label><label>Capacity<input name="capacity" type="number" min="1" value="1" required></label><div class="actions"><button type="submit">Add pattern</button><button type="button" id="loadPatterns">Refresh patterns</button></div></form><pre id="patterns" class="output"></pre></section>
<section class="panel"><h2>Doctor schedule</h2><div class="inline"><label>Date<input id="scheduleDate" type="date"></label><button id="loadSchedule">View schedule</button></div><pre id="schedule" class="output"></pre></section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
