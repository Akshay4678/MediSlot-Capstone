{% extends "base.html" %}
{% block title %}My profile - MediSlot{% endblock %}
{% block content %}
<h1>My profile</h1>
<div class="card">
  <form method="post" id="patient-profile-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <label>First name *<input name="first_name" value="{{ p.first_name or '' }}" maxlength="100" required></label>
      <label>Last name *<input name="last_name" value="{{ p.last_name or '' }}" maxlength="100" required></label>
      <label>Date of birth<input type="date" name="date_of_birth" value="{{ p.date_of_birth or '' }}"></label>
      <label>Gender
        <select name="gender">
          <option value="">Not specified</option>
          {% for g in ['Male', 'Female', 'Other', 'Prefer not to say'] %}
          <option value="{{ g }}" {% if p.gender == g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Phone<input name="phone" value="{{ p.phone or '' }}" maxlength="30" placeholder="+91 98765 43210"></label>
      <label>City<input name="city" value="{{ p.city or '' }}" maxlength="100"></label>
      <label>Address<input name="address" value="{{ p.address or '' }}" maxlength="500"></label>
      <label>Emergency contact<input name="emergency_contact" value="{{ p.emergency_contact or '' }}" maxlength="150"></label>
    </div>
    <p><button type="submit">Save profile</button></p>
  </form>
</div>
<div class="card">
  <h2>Delete my profile</h2>
  <p class="muted">Erases your personal details and closes your account. You must cancel upcoming appointments first.</p>
  <form method="post" action="{{ url_for('patient.profile_delete') }}"
        onsubmit="return confirm('Delete your profile and close your account? This cannot be undone.');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="secondary">Delete my profile</button>
  </form>
</div>
{% endblock %}
