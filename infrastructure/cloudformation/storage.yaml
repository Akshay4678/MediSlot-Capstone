AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot storage - private S3 bucket for doctor profile photos (uploaded with pre-signed POST).

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-z0-9-]+$'
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-photos-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PhotoBucket.Arn
              - !Sub '${PhotoBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  PhotoBucketName:
    Description: Private bucket holding doctor profile photos.
    Value: !Ref PhotoBucket
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PhotoBucketName'
  PhotoBucketArn:
    Value: !GetAtt PhotoBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PhotoBucketArn'
