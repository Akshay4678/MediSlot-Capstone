name: MediSlot AWS Deployment

on:
  push:
    branches:
      - milestone-2-branch

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: medislot-deployment-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    # Allows environment-specific GitHub variables for dev, test, and prod.
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    if: github.ref == 'refs/heads/milestone-2-branch'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: medislot
      ENVIRONMENT_NAME: ${{ github.event.inputs.environment || 'dev' }}

    steps:

      # ==========================================
      # STEP 1: Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # STEP 2: Check deployment configuration
      # ==========================================
      - name: Check deployment configuration and files
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_REGION:-}" || "${AWS_REGION}" == "None" ]]; then
            echo "::error::Set the AWS_REGION repository variable."
            exit 1
          fi

          if [[ -z "${AWS_ROLE_ARN:-}" ]]; then
            echo "::error::Set the AWS_ROLE_ARN repository secret."
            exit 1
          fi

          case "${ENVIRONMENT_NAME}" in
            dev|test|prod) ;;
            *)
              echo "::error::Invalid environment: ${ENVIRONMENT_NAME}"
              exit 1
              ;;
          esac

          for template in \
            infrastructure/cloudformation/network.yaml \
            infrastructure/cloudformation/rds.yaml \
            infrastructure/cloudformation/auth.yaml \
            infrastructure/cloudformation/api.yaml
          do
            if [[ ! -f "${template}" ]]; then
              echo "::error::CloudFormation template not found: ${template}"
              exit 1
            fi
          done

          if [[ ! -d "application" ]]; then
            echo "::error::The application/ directory was not found."
            exit 1
          fi

          echo "Project: ${PROJECT_NAME}"
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Region: ${AWS_REGION}"
          echo "Branch: ${GITHUB_REF_NAME}"

      # ==========================================
      # STEP 3: Configure AWS credentials using OIDC
      # ==========================================
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MediSlotGitHubActions

      # ==========================================
      # STEP 4: Verify AWS connection
      # ==========================================
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ==========================================
      # STEP 5: Validate CloudFormation templates
      # ==========================================
      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/cloudformation/network.yaml \
            infrastructure/cloudformation/rds.yaml \
            infrastructure/cloudformation/auth.yaml \
            infrastructure/cloudformation/api.yaml
          do
            echo "Validating ${template}"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "${AWS_REGION}" >/dev/null

            echo "Validation passed: ${template}"
          done

      # ==========================================
      # STEP 6: Deploy Network Stack
      # ==========================================
      - name: Deploy Network Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-network"

          echo "Deploying Network Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/network.yaml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "EnableNatGateway=false" \
              "EnableS3GatewayEndpoint=true" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

      # ==========================================
      # STEP 7: Read Network Stack outputs for RDS
      # ==========================================
      - name: Read Network Stack Outputs
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-network"

          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue | [0]" \
              --output text \
              --region "${AWS_REGION}"
          }

          DB_SUBNET_1="$(get_output PrivateDbSubnet1Id)"
          DB_SUBNET_2="$(get_output PrivateDbSubnet2Id)"
          DB_SECURITY_GROUP_ID="$(get_output DatabaseSecurityGroupId)"
          LAMBDA_SUBNET_1_ID="$(get_output PrivateAppSubnet1Id)"
          LAMBDA_SUBNET_2_ID="$(get_output PrivateAppSubnet2Id)"
          LAMBDA_SECURITY_GROUP_ID="$(get_output AppSecurityGroupId)"

          for name in DB_SUBNET_1 DB_SUBNET_2 DB_SECURITY_GROUP_ID LAMBDA_SUBNET_1_ID LAMBDA_SUBNET_2_ID LAMBDA_SECURITY_GROUP_ID; do
            value="${!name}"

            if [[ -z "${value}" || "${value}" == "None" ]]; then
              echo "::error::Required network output '${name}' is missing."
              exit 1
            fi
          done

          {
            echo "DB_SUBNET_1=${DB_SUBNET_1}"
            echo "DB_SUBNET_2=${DB_SUBNET_2}"
            echo "DB_SECURITY_GROUP_ID=${DB_SECURITY_GROUP_ID}"
            echo "LAMBDA_SUBNET_1_ID=${LAMBDA_SUBNET_1_ID}"
            echo "LAMBDA_SUBNET_2_ID=${LAMBDA_SUBNET_2_ID}"
            echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP_ID}"
          } >> "${GITHUB_ENV}"

          echo "Database network configuration loaded."

      # ==========================================
      # STEP 8: Deploy RDS and Data Stack
      # ==========================================
      - name: Deploy RDS and Data Stack
        shell: bash
        env:
          DB_USERNAME_INPUT: ${{ vars.MEDISLOT_DB_USERNAME }}
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-data"

          DB_USERNAME="${DB_USERNAME_INPUT:-medislot_admin}"
          DB_NAME="medislot"

          if [[ "${ENVIRONMENT_NAME}" == "prod" ]]; then
            DELETION_PROTECTION=true
          else
            DELETION_PROTECTION=false
          fi

          echo "Deploying Data Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/rds.yaml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "PrivateDbSubnet1Id=${DB_SUBNET_1}" \
              "PrivateDbSubnet2Id=${DB_SUBNET_2}" \
              "DatabaseSecurityGroupId=${DB_SECURITY_GROUP_ID}" \
              "DBName=${DB_NAME}" \
              "DBUsername=${DB_USERNAME}" \
              "EnableDeletionProtection=${DELETION_PROTECTION}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

      # ==========================================
      # STEP 9: Read deployment bucket from Data Stack
      # ==========================================
      - name: Read Lambda artifacts bucket from Data Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-data"

          LAMBDA_ARTIFACTS_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          if [[ -z "${LAMBDA_ARTIFACTS_BUCKET}" || "${LAMBDA_ARTIFACTS_BUCKET}" == "None" ]]; then
            echo "::error::ArtifactsBucketName output was not found in ${STACK_NAME}."
            exit 1
          fi

          # Ensure the bucket exists and the current role can access it.
          aws s3api head-bucket \
            --bucket "${LAMBDA_ARTIFACTS_BUCKET}" \
            --region "${AWS_REGION}"

          # Read the DynamoDB table names from the Data Stack outputs.
          get_data_output() {
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue | [0]" \
              --output text \
              --region "${AWS_REGION}"
          }

          IDEMPOTENCY_TABLE_NAME="$(get_data_output IdempotencyTableName)"
          SLOT_CAPACITY_TABLE_NAME="$(get_data_output SlotCapacityTableName)"
          WAITLIST_TABLE_NAME="$(get_data_output WaitlistTableName)"
          NOTIFICATION_DISPATCH_TABLE_NAME="$(get_data_output NotificationDispatchTableName)"

          for name in IDEMPOTENCY_TABLE_NAME SLOT_CAPACITY_TABLE_NAME WAITLIST_TABLE_NAME NOTIFICATION_DISPATCH_TABLE_NAME; do
            value="${!name}"
            if [[ -z "${value}" || "${value}" == "None" ]]; then
              echo "::error::Required Data Stack output '${name}' is missing from ${STACK_NAME}."
              exit 1
            fi
          done

          {
            echo "LAMBDA_ARTIFACTS_BUCKET=${LAMBDA_ARTIFACTS_BUCKET}"
            echo "IDEMPOTENCY_TABLE_NAME=${IDEMPOTENCY_TABLE_NAME}"
            echo "SLOT_CAPACITY_TABLE_NAME=${SLOT_CAPACITY_TABLE_NAME}"
            echo "WAITLIST_TABLE_NAME=${WAITLIST_TABLE_NAME}"
            echo "NOTIFICATION_DISPATCH_TABLE_NAME=${NOTIFICATION_DISPATCH_TABLE_NAME}"
          } >> "${GITHUB_ENV}"

          echo "Using artifacts bucket from Data Stack: ${LAMBDA_ARTIFACTS_BUCKET}"
          echo "DynamoDB table names loaded from Data Stack."

      # ==========================================
      # STEP 10: Deploy Authentication Stack
      # ==========================================
      - name: Deploy Authentication Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-auth"

          echo "Deploying Authentication Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/auth.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

      # ==========================================
      # STEP 11: Package Python Lambda code
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda code
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="${RUNNER_TEMP}/lambda-package"
          ZIP_FILE="${RUNNER_TEMP}/medislot-lambda.zip"

          rm -rf "${PACKAGE_DIR}"
          mkdir -p "${PACKAGE_DIR}"

          # Install Python dependencies when requirements.txt exists.
          if [[ -f "requirements.txt" ]]; then
            python -m pip install \
              --requirement requirements.txt \
              --target "${PACKAGE_DIR}"
          fi

          # Copy the application directory into the ZIP root.
          cp -R application "${PACKAGE_DIR}/application"

          # Create the ZIP with application/ at its root.
          (
            cd "${PACKAGE_DIR}"
            zip -qr "${ZIP_FILE}" .
          )

          if [[ ! -s "${ZIP_FILE}" ]]; then
            echo "::error::Lambda ZIP package was not created."
            exit 1
          fi

          echo "Lambda package created successfully."

      # ==========================================
      # STEP 12: Upload Lambda ZIP to S3
      # ==========================================
      - name: Upload Lambda package to S3
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${RUNNER_TEMP}/medislot-lambda.zip"

          S3_KEY="lambda/${ENVIRONMENT_NAME}/${GITHUB_SHA}/medislot-lambda.zip"

          echo "Uploading Lambda package..."

          aws s3 cp \
            "${ZIP_FILE}" \
            "s3://${LAMBDA_ARTIFACTS_BUCKET}/${S3_KEY}" \
            --region "${AWS_REGION}"

          {
            echo "LAMBDA_CODE_S3_BUCKET=${LAMBDA_ARTIFACTS_BUCKET}"
            echo "LAMBDA_CODE_S3_KEY=${S3_KEY}"
          } >> "${GITHUB_ENV}"

          echo "Lambda package uploaded."
          echo "S3 key: ${S3_KEY}"

      # ==========================================
      # STEP 13: Deploy API Gateway and Lambda Stack
      # ==========================================
      - name: Deploy API and Lambda Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-api"

          echo "Deploying API Stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/api.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "EnvironmentName=${ENVIRONMENT_NAME}" \
              "LambdaCodeS3Bucket=${LAMBDA_CODE_S3_BUCKET}" \
              "LambdaCodeS3Key=${LAMBDA_CODE_S3_KEY}" \
              "LambdaSubnetIds=${LAMBDA_SUBNET_1_ID},${LAMBDA_SUBNET_2_ID}" \
              "LambdaSecurityGroupId=${LAMBDA_SECURITY_GROUP_ID}" \
              "IdempotencyTableName=${IDEMPOTENCY_TABLE_NAME}" \
              "SlotCapacityTableName=${SLOT_CAPACITY_TABLE_NAME}" \
              "WaitlistTableName=${WAITLIST_TABLE_NAME}" \
              "NotificationDispatchTableName=${NOTIFICATION_DISPATCH_TABLE_NAME}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

          echo "API Stack deployed successfully."

      # ==========================================
      # STEP 14: Display API endpoint
      # ==========================================
      - name: Display API endpoint
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT_NAME}-api"

          API_ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue | [0]" \
            --output text \
            --region "${AWS_REGION}")"

          if [[ -z "${API_ENDPOINT}" || "${API_ENDPOINT}" == "None" ]]; then
            echo "::error::ApiEndpoint output was not found."
            exit 1
          fi

          echo "========================================"
          echo "MediSlot API Deployment"
          echo "========================================"
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "API endpoint: ${API_ENDPOINT}"
          echo ""
          echo "Configured routes include:"
          echo "POST ${API_ENDPOINT}/auth"
          echo "GET  ${API_ENDPOINT}/doctors/search"
          echo "GET  ${API_ENDPOINT}/availability"
          echo "POST ${API_ENDPOINT}/bookings"
          echo "GET  ${API_ENDPOINT}/appointments"
          echo "GET  ${API_ENDPOINT}/waitlist"
          echo "GET  ${API_ENDPOINT}/reports"

      # ==========================================
      # STEP 15: Display deployment status
      # ==========================================
      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "MediSlot CloudFormation Deployment"
          echo "========================================"

          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Region: ${AWS_REGION}"

          for stack in network data auth api; do
            stack_name="${PROJECT_NAME}-${ENVIRONMENT_NAME}-${stack}"

            echo ""
            echo "Stack: ${stack_name}"

            aws cloudformation describe-stacks \
              --stack-name "${stack_name}" \
              --query "Stacks[0].StackStatus" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null \
              || echo "Stack does not exist or could not be described."
          done