AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Milestone 4 patient-domain API (profile, doctor search, public doctor profile, slot availability).

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseSecretArn:
    Type: String
  DatabaseHost:
    Type: String
  DatabaseName:
    Type: String
    Default: medislot

Resources:
  PatientApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-patient-api-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: PatientApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseCredentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Sid: ReadBusinessRules
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/rules/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PatientApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-patient-api'
      Runtime: python3.12
      Handler: application.patient_api.handler.lambda_handler
      Role: !GetAtt PatientApiRole.Arn
      Timeout: 29
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DB_HOST: !Ref DatabaseHost
          DB_NAME: !Ref DatabaseName
          SSM_PREFIX: !Sub '/${ProjectName}/${EnvironmentName}'
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  PatientApiFunctionArn:
    Value: !GetAtt PatientApiFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PatientApiFunctionArn'
  PatientApiFunctionName:
    Value: !Ref PatientApiFunction
