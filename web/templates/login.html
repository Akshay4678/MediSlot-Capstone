<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ role|capitalize }} login - MediSlot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="top">
        <div class="bar">
            <a class="brand" href="/">MediSlot</a>
            <nav class="nav"></nav>
        </div>
    </header>

    <main>
        <div class="card" style="max-width:460px;margin:2rem auto">

            <h2>{{ role|capitalize }} login</h2>

            <form method="post" autocomplete="on">

                <!-- CSRF protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autofocus
                >

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                >

                <p>
                    <button type="submit">Sign in</button>
                </p>

            </form>

            <p class="small">
                New here?
                <a href="/{{ role }}/register">
                    Create a {{ role }} account
                </a>
                &middot;
                <a href="/">Back</a>
            </p>

        </div>
    </main>
</body>
</html>
