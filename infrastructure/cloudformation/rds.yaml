AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MediSlot data foundation - private RDS MySQL, (DynamoDB tables live in dynamodb.yaml and booking-tables.yaml),
  Secrets Manager, and private S3 artifacts and reports buckets.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  PrivateDbSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: First private database subnet from the Network stack.

  PrivateDbSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Second private database subnet from the Network stack.

  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Database security group from the Network stack.

  DBName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: Initial MySQL database name.

  DBUsername:
    Type: String
    Default: medislot_admin
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
    Description: RDS master username.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t4g.micro
      - db.t4g.small
      - db.m6g.large

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000

  DBSnapshotIdentifier:
    Type: String
    Default: ''
    Description: >
      Optional. RDS snapshot to restore the database from (keeps all accounts and data after the
      stacks were deleted). Empty = new empty database. The deploy pipeline fills this in.
      Changing it on an existing stack REPLACES the database.

  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable deletion protection for production databases.

# ============================================================
# CONDITIONS
# ============================================================

Conditions:
  RestoreFromSnapshot: !Not
    - !Equals
      - !Ref DBSnapshotIdentifier
      - ''

  IsProd: !Equals
    - !Ref EnvironmentName
    - prod

  DeletionProtectionEnabled: !Equals
    - !Ref EnableDeletionProtection
    - 'true'

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ----------------------------------------------------------
  # DATABASE CREDENTIALS
  # ----------------------------------------------------------

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub 'MediSlot ${EnvironmentName} RDS credentials'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # RDS SUBNET GROUP
  # ----------------------------------------------------------

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for MediSlot RDS.
      SubnetIds:
        - !Ref PrivateDbSubnet1Id
        - !Ref PrivateDbSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-db-subnet-group'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # RDS MYSQL DATABASE
  # ----------------------------------------------------------

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true

      # When restoring from a snapshot the database name and master user come from the snapshot.
      DBSnapshotIdentifier: !If
        - RestoreFromSnapshot
        - !Ref DBSnapshotIdentifier
        - !Ref AWS::NoValue

      DBName: !If
        - RestoreFromSnapshot
        - !Ref AWS::NoValue
        - !Ref DBName

      MasterUsername: !If
        - RestoreFromSnapshot
        - !Ref AWS::NoValue
        - !Ref DBUsername
      MasterUserPassword: !Sub
        - '{{resolve:secretsmanager:${SecretArn}:SecretString:password}}'
        - SecretArn: !Ref DatabaseSecret

      DBSubnetGroupName: !Ref DatabaseSubnetGroup

      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId

      PubliclyAccessible: false

      MultiAZ: !If
        - IsProd
        - true
        - false

      # 7 days in prod. Free-tier accounts reject more than 1 day, so other environments keep the daily backup only
      # (use scripts/backup_db.sh for longer-lived manual snapshots).
      BackupRetentionPeriod: !If
        - IsProd
        - 7
        - 1

      DeletionProtection: !If
        - DeletionProtectionEnabled
        - true
        - false

      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

      EnableCloudwatchLogsExports:
        - error
        - general
        - slowquery

      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-mysql'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # S3: PRIVATE ARTIFACTS BUCKET
  # ----------------------------------------------------------

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # S3: PRIVATE REPORTS BUCKET
  # ----------------------------------------------------------

  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DBInstanceIdentifier:
    Description: RDS instance identifier (used by the dashboard, the alarms and the DR drill).
    Value: !Ref MediSlotDatabase

  DBEndpointAddress:
    Description: Private RDS endpoint hostname.
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-DBEndpointAddress'

  DBEndpointPort:
    Description: MySQL port.
    Value: !GetAtt MediSlotDatabase.Endpoint.Port

  DBName:
    Description: Initial MySQL database name.
    Value: !Ref DBName

  DBSecretArn:
    Description: ARN of the Secrets Manager secret containing database credentials.
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-DBSecretArn'

  SSMDatabaseHostParameterName:
    Description: SSM Parameter Store path populated by the deployment workflow with the RDS endpoint.
    Value: !Sub '/${ProjectName}/${EnvironmentName}/database/host'

  SSMDatabaseSecretArnParameterName:
    Description: SSM Parameter Store path populated by the deployment workflow with the database secret ARN.
    Value: !Sub '/${ProjectName}/${EnvironmentName}/database/secret-arn'

  SSMDatabaseNameParameterName:
    Description: SSM Parameter Store path populated by the deployment workflow with the database name.
    Value: !Sub '/${ProjectName}/${EnvironmentName}/database/name'

  ArtifactsBucketName:
    Description: Private S3 artifacts bucket name.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-ArtifactsBucketName'

  ReportsBucketName:
    Description: Private S3 bucket for generated reports.
    Value: !Ref ReportsBucket
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-ReportsBucketName'
