name: MediSlot CI

on:
  push:
    branches:
      - milestone-2-branch

  pull_request:
    branches:
      - milestone-2-branch

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloudformation:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint

      - name: Validate Network Stack
        run: |
          cfn-lint infrastructure/cloudformation/network.yaml

      - name: Validate RDS and Data Stack
        run: |
          cfn-lint infrastructure/cloudformation/rds.yaml

      - name: Validate Authentication Stack
        run: |
          cfn-lint infrastructure/cloudformation/auth.yaml

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 PyMySQL bcrypt PyJWT

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/unit -v
