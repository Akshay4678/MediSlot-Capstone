```yaml
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MediSlot IAM Stack - least-privilege execution roles for
  authentication and JWT authorization Lambda functions.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

Resources:
  AuthLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-auth-lambda-role'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReadJwtSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadJwtSecretParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub
                  - 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}'
                  - ParameterPath: !Sub '/${ProjectName}/${EnvironmentName}/auth/jwt-secret'

              - Sid: DecryptJwtSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AuthorizerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-authorizer-lambda-role'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReadJwtSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadJwtSecretParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub
                  - 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}'
                  - ParameterPath: !Sub '/${ProjectName}/${EnvironmentName}/auth/jwt-secret'

              - Sid: DecryptJwtSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  JwtSecretParameterName:
    Description: >
      SSM SecureString parameter name. Create the parameter separately;
      its secret value is never exposed through CloudFormation outputs.
    Value: !Sub '/${ProjectName}/${EnvironmentName}/auth/jwt-secret'

  AuthLambdaExecutionRoleArn:
    Description: Execution role ARN for authentication Lambda functions.
    Value: !GetAtt AuthLambdaExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AuthLambdaExecutionRoleArn'

  AuthorizerLambdaExecutionRoleArn:
    Description: Execution role ARN for the JWT authorizer Lambda.
    Value: !GetAtt AuthorizerLambdaExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AuthorizerLambdaExecutionRoleArn'
```