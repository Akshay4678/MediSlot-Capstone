AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Flask doctor and patient dashboards on one EC2 instance.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  ArtifactsBucketName:
    Type: String
    Description: S3 bucket containing the self-contained web application ZIP.
  WebPackageKey:
    Type: String
    Description: Versioned S3 key of the web application ZIP.
  ApiBaseUrl:
    Type: String
    Description: API Gateway base URL including the stage.
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro]
  InstanceConnectCidr:
    Type: String
    Default: 13.233.177.0/29
    Description: EC2 Instance Connect source CIDR for ap-south-1; set empty to disable SSH ingress.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  AllowInstanceConnect: !Not [!Equals [!Ref InstanceConnectCidr, '']]

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MediSlot web app - HTTP from internet, EC2 Instance Connect only for SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP dashboard access
        - !If
          - AllowInstanceConnect
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref InstanceConnectCidr
            Description: EC2 Instance Connect
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WebAppRuntimeAndBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadApplicationPackage
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucketName}/web/*'
              - Sid: ReadWebSettings
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/web/*'
              - Sid: SignalCloudFormation
                Effect: Allow
                Action:
                  - cloudformation:SignalResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-role'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebInstanceRole

  WebInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WebInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref PublicSubnetId
          GroupSet:
            - !Ref WebSecurityGroup
          Description: !Sub 'MediSlot web package ${WebPackageKey}'
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          exec > >(tee /var/log/medislot-bootstrap.log) 2>&1

          STACK_NAME='${AWS::StackName}'
          REGION='${AWS::Region}'
          signal() {
            local result="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if aws cloudformation signal-resource \
                --stack-name "$STACK_NAME" \
                --logical-resource-id WebInstance \
                --unique-id "$(hostname)-$(date +%s)" \
                --status "$result" \
                --region "$REGION"; then
                echo "CloudFormation ${result} signal sent."
                return 0
              fi
              echo "CloudFormation signal attempt ${!attempt}/5 failed; retrying."
              sleep 3
            done
            echo "ERROR: Could not send CloudFormation ${result} signal."
            return 1
          }
          on_error() {
            local rc=$?
            echo "Bootstrap failed at line $BASH_LINENO (exit $rc)"
            signal FAILURE || true
            exit "$rc"
          }
          trap on_error ERR

          echo "Starting MediSlot web bootstrap at $(date -Is)"
          command -v aws
          command -v python3
          command -v curl
          command -v systemctl
          aws sts get-caller-identity --region "$REGION"

          # The GitHub Actions package contains dependencies built for Python 3.9.
          # No dnf, pip, compiler, or internet package installation is needed on EC2.
          install -d -o root -g root -m 0755 /opt/medislot
          aws s3 cp \
            's3://${ArtifactsBucketName}/${WebPackageKey}' \
            /tmp/medislot-web.zip \
            --region "$REGION"

          python3 -m zipfile -e /tmp/medislot-web.zip /opt/medislot
          test -f /opt/medislot/app.py
          test -d /opt/medislot/vendor

          PYTHONPATH=/opt/medislot/vendor:/opt/medislot /usr/bin/python3 - <<'PY'
          import sys
          print("EC2 Python runtime:", sys.version)
          import flask, gunicorn, requests, boto3
          print("Verified Flask, Gunicorn, Requests and Boto3 imports.")
          PY

          id medislot >/dev/null 2>&1 || \
            useradd --system --home-dir /opt/medislot --shell /sbin/nologin medislot
          chown -R root:root /opt/medislot
          chmod -R a+rX /opt/medislot

          cat > /etc/medislot-web.env <<'ENVEOF'
          API_BASE_URL=${ApiBaseUrl}
          AWS_DEFAULT_REGION=${AWS::Region}
          SECRET_KEY_PARAMETER=/${ProjectName}/${EnvironmentName}/web/flask-secret-key
          PYTHONPATH=/opt/medislot/vendor:/opt/medislot
          ENVEOF
          chmod 0640 /etc/medislot-web.env
          chown root:medislot /etc/medislot-web.env

          cat > /etc/systemd/system/medislot-web.service <<'UNITEOF'
          [Unit]
          Description=MediSlot web application (Flask/Gunicorn)
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=medislot
          Group=medislot
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/etc/medislot-web.env
          ExecStart=/usr/bin/python3 -m gunicorn --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:80 --access-logfile - --error-logfile - app:app
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNITEOF

          systemctl daemon-reload
          systemctl enable medislot-web.service
          systemctl restart medislot-web.service

          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1/healthz; then
              healthy=1
              break
            fi
            echo "Health check attempt ${!attempt}/30 did not pass yet."
            sleep 2
          done
          if [[ "$healthy" -ne 1 ]]; then
            systemctl status medislot-web.service --no-pager || true
            journalctl -u medislot-web.service -n 100 --no-pager || true
            exit 1
          fi

          echo "MediSlot web application is healthy."
          trap - ERR
          signal SUCCESS
          echo "CloudFormation success signal sent at $(date -Is)"

  WebElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-eip'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt WebElasticIp.AllocationId
      InstanceId: !Ref WebInstance

Outputs:
  WebUrl:
    Description: Public URL of the MediSlot web application.
    Value: !Sub 'http://${WebElasticIp}'
  WebInstanceId:
    Description: EC2 instance hosting the MediSlot dashboards.
    Value: !Ref WebInstance
  WebSecurityGroupId:
    Description: Security group attached to the web instance.
    Value: !Ref WebSecurityGroup
