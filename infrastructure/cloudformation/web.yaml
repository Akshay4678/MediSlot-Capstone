AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot web application - one disposable EC2 t2.micro running the Flask dashboards (doctor and patient portals).

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  ArtifactsBucketName:
    Type: String
    Description: Bucket that holds the packaged web application (web/ prefix).
  WebPackageKey:
    Type: String
    Description: S3 key of the web application ZIP. A new key replaces the instance (it is disposable).
  ApiBaseUrl:
    Type: String
    Description: Base URL of the MediSlot REST API, including the stage.
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MediSlot web app - HTTP from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Allow the web EC2 instance to retrieve its Flask secret from the SSM
  # interface endpoint over HTTPS. The endpoint SG is exported by the Network stack.
  WebToSsmEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${ProjectName}-${EnvironmentName}-SecretsManagerEndpointSecurityGroupId'
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref WebSecurityGroup
      Description: Allow HTTPS from MediSlot web EC2 to SSM and Secrets Manager endpoints

  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-web-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WebAppBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadApplicationPackage
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucketName}/web/*'
              - Sid: ReadWebSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/web/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebInstanceRole

  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref WebInstanceProfile
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/medislot-bootstrap.log) 2>&1

          dnf install -y python3-pip
          useradd --system --home-dir /opt/medislot --shell /sbin/nologin medislot || true
          mkdir -p /opt/medislot

          # The instance is disposable: the application is pulled from S3 on every boot.
          aws s3 cp s3://${ArtifactsBucketName}/${WebPackageKey} /tmp/web.zip --region ${AWS::Region}
          python3 -m zipfile -e /tmp/web.zip /opt/medislot
          python3 -m pip install --no-cache-dir -r /opt/medislot/requirements.txt
          chown -R medislot:medislot /opt/medislot

          cat > /etc/medislot-web.env <<'ENVEOF'
          API_BASE_URL=${ApiBaseUrl}
          AWS_DEFAULT_REGION=${AWS::Region}
          SECRET_KEY_PARAMETER=/${ProjectName}/${EnvironmentName}/web/flask-secret-key
          ENVEOF
          chmod 600 /etc/medislot-web.env

          cat > /etc/systemd/system/medislot-web.service <<'UNITEOF'
          [Unit]
          Description=MediSlot web application (Flask via gunicorn)
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=medislot
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/etc/medislot-web.env
          ExecStart=/usr/local/bin/gunicorn --workers 2 --bind 0.0.0.0:80 --access-logfile - app:app
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNITEOF

          systemctl daemon-reload
          systemctl enable --now medislot-web.service

  WebElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-eip'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt WebElasticIp.AllocationId
      InstanceId: !Ref WebInstance

Outputs:
  WebUrl:
    Description: Public URL of the MediSlot web application.
    Value: !Sub 'http://${WebElasticIp}'
  WebInstanceId:
    Value: !Ref WebInstance
