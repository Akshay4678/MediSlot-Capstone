
AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot API foundation - HTTP API, Lambda handlers, JWT authorizer integration points, and least-privilege resource configuration.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two private application subnet IDs from the existing Network stack.

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Application Lambda security group from the existing Network stack.

  DatabaseSecretArn:
    Type: String
    Description: Secret ARN output by the existing Data stack.

  IdempotencyTableName:
    Type: String
    Description: Physical name of the existing Idempotency DynamoDB table.

  SlotCapacityTableName:
    Type: String
    Description: Physical name of the existing SlotCapacity DynamoDB table.

  WaitlistTableName:
    Type: String
    Description: Physical name of the existing Waitlist DynamoDB table.

  NotificationDispatchTableName:
    Type: String
    Description: Physical name of the existing NotificationDispatch DynamoDB table.

Resources:
  ApiLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-api-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: MediSlotApiDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Sid: IdempotencyTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdempotencyTableName}'
              - Sid: SlotCapacityTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SlotCapacityTableName}'
              - Sid: WaitlistTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WaitlistTableName}'
              - Sid: NotificationDispatchTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${NotificationDispatchTableName}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api-handler'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ApiLambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          ENVIRONMENT_NAME: !Ref EnvironmentName
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTableName
          SLOT_CAPACITY_TABLE_NAME: !Ref SlotCapacityTableName
          WAITLIST_TABLE_NAME: !Ref WaitlistTableName
          NOTIFICATION_DISPATCH_TABLE_NAME: !Ref NotificationDispatchTableName
      Code:
        ZipFile: |
          import json
          import os

          def response(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "content-type": "application/json",
                      "access-control-allow-origin": "*",
                      "access-control-allow-headers": "authorization,content-type,idempotency-key",
                      "access-control-allow-methods": "GET,POST,PATCH,DELETE,OPTIONS"
                  },
                  "body": json.dumps(body)
              }

          def handler(event, context):
              path = event.get("rawPath", "/")
              method = event.get("requestContext", {}).get("http", {}).get("method", "GET")

              if method == "OPTIONS":
                  return response(204, {})

              if path == "/health" and method == "GET":
                  return response(200, {
                      "service": "MediSlot API",
                      "status": "healthy",
                      "environment": os.environ.get("ENVIRONMENT_NAME", "unknown")
                  })

              return response(501, {
                  "message": "API infrastructure is deployed, but this endpoint's business logic has not been implemented yet.",
                  "path": path,
                  "method": method
              })

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  MediSlotHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
          - idempotency-key
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MediSlotHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt ApiHandlerFunction.Arn
      PayloadFormatVersion: '2.0'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MediSlotHttpApi
      RouteKey: 'GET /health'
      Target: !Sub 'integrations/${ApiIntegration}'

  CatchAllRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MediSlotHttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MediSlotHttpApi
      StageName: '$default'
      AutoDeploy: true
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MediSlotHttpApi}/*/*'

Outputs:
  ApiId:
    Description: HTTP API ID
    Value: !Ref MediSlotHttpApi

  ApiEndpoint:
    Description: Base URL for the deployed HTTP API
    Value: !GetAtt MediSlotHttpApi.ApiEndpoint

  HealthEndpoint:
    Description: Health check endpoint
    Value: !Sub '${MediSlotHttpApi.ApiEndpoint}/health'

  ApiHandlerFunctionName:
    Value: !Ref ApiHandlerFunction

  ApiLambdaExecutionRoleArn:
    Value: !GetAtt ApiLambdaExecutionRole.Arn
