
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MediSlot Milestone 3 Authentication DynamoDB Tables.
  Creates Active Access Token and Refresh Token tables.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  # ==========================================
  # ACTIVE ACCESS TOKEN TABLE
  # ==========================================

  TokenActiveListTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-token-activelist-m3'

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: jti
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: jti
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Milestone
          Value: M3

  # ==========================================
  # REFRESH TOKEN TABLE
  # ==========================================

  RefreshTokenTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: !Sub '${EnvironmentName}-medislot-refresh-tokens-m3'

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S

      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Milestone
          Value: M3

Outputs:

  TokenActiveListTableName:
    Description: Active Access Token DynamoDB Table
    Value: !Ref TokenActiveListTable
    Export:
      Name: !Sub '${EnvironmentName}-TokenActiveListTableName'

  TokenActiveListTableArn:
    Description: Active Access Token Table ARN
    Value: !GetAtt TokenActiveListTable.Arn

  RefreshTokenTableName:
    Description: Refresh Token DynamoDB Table
    Value: !Ref RefreshTokenTable
    Export:
      Name: !Sub '${EnvironmentName}-RefreshTokenTableName'

  RefreshTokenTableArn:
    Description: Refresh Token Table ARN
    Value: !GetAtt RefreshTokenTable.Arn
