AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MediSlot Network Stack - VPC, public and private subnets, routing,
  security groups, optional NAT Gateway, and optional S3 Gateway Endpoint.

Parameters:
  ProjectName:
    Type: String
    Default: medislot
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    Description: Project name used in resource names and tags.

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment.

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR block for the VPC.

  PublicSubnet1Cidr:
    Type: String
    Default: 10.20.1.0/24
    Description: CIDR block for public subnet 1.

  PublicSubnet2Cidr:
    Type: String
    Default: 10.20.2.0/24
    Description: CIDR block for public subnet 2.

  PrivateAppSubnet1Cidr:
    Type: String
    Default: 10.20.11.0/24
    Description: CIDR block for private application subnet 1.

  PrivateAppSubnet2Cidr:
    Type: String
    Default: 10.20.12.0/24
    Description: CIDR block for private application subnet 2.

  PrivateDbSubnet1Cidr:
    Type: String
    Default: 10.20.21.0/24
    Description: CIDR block for private database subnet 1.

  PrivateDbSubnet2Cidr:
    Type: String
    Default: 10.20.22.0/24
    Description: CIDR block for private database subnet 2.

  EnableNatGateway:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Set to true if private application resources need outbound internet
      access through a NAT Gateway. NAT Gateway incurs additional charges.

  EnableS3GatewayEndpoint:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create an S3 Gateway VPC endpoint for private route tables.

  WorkbenchInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t2.micro
    Description: Small EC2 instance type for secure MySQL Workbench access through SSM port forwarding.

Conditions:
  CreateNatGateway: !Equals [!Ref EnableNatGateway, 'true']
  CreateS3Endpoint: !Equals [!Ref EnableS3GatewayEndpoint, 'true']

Resources:
  # VPC
  MediSlotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-vpc'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-igw'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MediSlotVPC
      InternetGatewayId: !Ref InternetGateway

  # Public subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-subnet-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-subnet-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Private application subnets
  PrivateAppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateAppSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-app-subnet-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateAppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateAppSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-app-subnet-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Private database subnets
  PrivateDbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateDbSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-db-subnet-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateDbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateDbSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-db-subnet-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Public routing
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Private application routing
  PrivateAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-app-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateAppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet1
      RouteTableId: !Ref PrivateAppRouteTable

  PrivateAppSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet2
      RouteTableId: !Ref PrivateAppRouteTable

  # Private database routing (no default internet route)
  PrivateDbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-private-db-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateDbSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnet1
      RouteTableId: !Ref PrivateDbRouteTable

  PrivateDbSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDbSubnet2
      RouteTableId: !Ref PrivateDbRouteTable

  # Optional NAT Gateway, placed in public subnet 1
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    Condition: CreateNatGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat-eip'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateAppDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNatGateway
    Properties:
      RouteTableId: !Ref PrivateAppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # Optional S3 Gateway Endpoint
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateS3Endpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateAppRouteTable
        - !Ref PrivateDbRouteTable
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-s3-endpoint'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Application security group. No inbound rules by default.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} ${EnvironmentName} application resources'
      VpcId: !Ref MediSlotVPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-app-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # Database SG allows MySQL from the application SG and the dedicated Workbench SG only.
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} ${EnvironmentName} MySQL database access from application resources'
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: Allow MySQL from application security group only
          IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-database-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------
  # EC2 MYSQL WORKBENCH ACCESS HOST (SSM, NO INBOUND SSH)
  # ----------------------------------------------------------

  WorkbenchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-workbench-ssm-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-workbench-ssm-role'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WorkbenchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-${EnvironmentName}-workbench-instance-profile'
      Roles:
        - !Ref WorkbenchInstanceRole

  WorkbenchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} ${EnvironmentName} MySQL Workbench access host; no inbound access'
      VpcId: !Ref MediSlotVPC
      # No inbound rules: use AWS Systems Manager Session Manager.
      SecurityGroupEgress:
        - Description: Allow MySQL connections to the RDS security group.
          IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
        - Description: Allow HTTPS to Systems Manager endpoints.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-workbench-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WorkbenchToDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      Description: Allow MySQL only from the dedicated Workbench EC2 security group.
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref WorkbenchSecurityGroup

  WorkbenchInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - InternetGatewayAttachment
      - PublicDefaultRoute
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref WorkbenchInstanceType
      IamInstanceProfile: !Ref WorkbenchInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref WorkbenchSecurityGroup
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-mysql-workbench-host'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  VpcId:
    Description: VPC ID.
    Value: !Ref MediSlotVPC
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-VpcId'

  PublicSubnet1Id:
    Description: First public subnet ID.
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnet1Id'

  PublicSubnet2Id:
    Description: Second public subnet ID.
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PublicSubnet2Id'

  PrivateAppSubnet1Id:
    Description: First private application subnet ID.
    Value: !Ref PrivateAppSubnet1
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateAppSubnet1Id'

  PrivateAppSubnet2Id:
    Description: Second private application subnet ID.
    Value: !Ref PrivateAppSubnet2
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateAppSubnet2Id'

  PrivateDbSubnet1Id:
    Description: First private database subnet ID.
    Value: !Ref PrivateDbSubnet1
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateDbSubnet1Id'

  PrivateDbSubnet2Id:
    Description: Second private database subnet ID.
    Value: !Ref PrivateDbSubnet2
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateDbSubnet2Id'

  AppSecurityGroupId:
    Description: Application security group ID.
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-AppSecurityGroupId'

  DatabaseSecurityGroupId:
    Description: Database security group ID.
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-DatabaseSecurityGroupId'

  PublicRouteTableId:
    Description: Public route table ID.
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PublicRouteTableId'

  PrivateAppRouteTableId:
    Description: Private application route table ID.
    Value: !Ref PrivateAppRouteTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateAppRouteTableId'

  PrivateDbRouteTableId:
    Description: Private database route table ID.
    Value: !Ref PrivateDbRouteTable
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-PrivateDbRouteTableId'

  WorkbenchInstanceId:
    Description: EC2 instance ID for SSM port forwarding to private RDS.
    Value: !Ref WorkbenchInstance
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-WorkbenchInstanceId'

  WorkbenchSecurityGroupId:
    Description: Security group attached to the Workbench EC2 instance.
    Value: !Ref WorkbenchSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-WorkbenchSecurityGroupId'

  WorkbenchPublicIp:
    Description: Public IP address of the Workbench EC2 instance (SSM is used; no inbound ports are opened).
    Value: !GetAtt WorkbenchInstance.PublicIp

  NatGatewayId:
    Condition: CreateNatGateway
    Description: NAT Gateway ID, if NAT is enabled.
    Value: !Ref NatGateway

  S3GatewayEndpointId:
    Condition: CreateS3Endpoint
    Description: S3 Gateway VPC Endpoint ID, if enabled.
    Value: !Ref S3GatewayEndpoint
