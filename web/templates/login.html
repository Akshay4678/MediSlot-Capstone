
{% extends "base.html" %}

{% block title %}{{ role|capitalize }} login - MediSlot{% endblock %}

{% block content %}
<div class="card" style="max-width:460px;margin:2rem auto">

    <h2>{{ role|capitalize }} login</h2>

    <form method="post" autocomplete="on">

        <!-- CSRF protection -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_value }}"
        >

        <label for="email">Email</label>
        <input
            id="email"
            name="email"
            type="email"
            required
            autofocus
            autocomplete="username"
        >

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
        >

        <p>
            <button type="submit">Sign in</button>
        </p>

    </form>

    <p class="small">
        New here?
        <a href="{{ url_for(role ~ '.register') }}">
            Create a {{ role }} account
        </a>
        &middot;
        <a href="{{ url_for('landing') }}">Back</a>
    </p>

</div>
{% endblock %}
