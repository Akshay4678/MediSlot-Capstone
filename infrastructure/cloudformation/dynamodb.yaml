AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MediSlot authentication state tables: the active access token list and the refresh tokens.
  Table names are generated by CloudFormation and passed on to the other stacks as parameters.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment.

Resources:
  # One row per user holding that user's CURRENT access token (jti).
  # Writing a new token overwrites the row, so the previous token stops working at once;
  # logout deletes the row. The authorizer reads it with a strongly consistent GetItem.
  TokenActiveListTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

  # Refresh tokens are stored only as SHA-256 hashes. The user_id index lets logout
  # delete every refresh token that belongs to one user.
  RefreshTokenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: token_hash
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  TokenActiveListTableName:
    Description: Active access token table name.
    Value: !Ref TokenActiveListTable
  TokenActiveListTableArn:
    Value: !GetAtt TokenActiveListTable.Arn
  RefreshTokenTableName:
    Description: Refresh token table name.
    Value: !Ref RefreshTokenTable
  RefreshTokenTableArn:
    Value: !GetAtt RefreshTokenTable.Arn
