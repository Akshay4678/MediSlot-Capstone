AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot web application - one disposable EC2 t2.micro running the Flask dashboards (doctor and patient portals).

Parameters:
  ProjectName:
    Type: String
    Default: medislot
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  ArtifactsBucketName:
    Type: String
    Description: Bucket that holds the packaged web application (web/ prefix).
  WebPackageKey:
    Type: String
    Description: S3 key of the web application ZIP. A new key replaces the instance (it is disposable).
  ApiBaseUrl:
    Type: String
    Description: Base URL of the MediSlot REST API, including the stage.
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro]
  InstanceConnectCidr:
    Type: String
    Default: 13.233.177.0/29
    Description: >
      Source range of the browser-based EC2 Instance Connect service for this region (default: ap-south-1).
      Find other regions in https://ip-ranges.amazonaws.com/ip-ranges.json (service EC2_INSTANCE_CONNECT).
      Leave empty to close port 22 completely (Session Manager keeps working without any inbound rule).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  AllowInstanceConnect: !Not [!Equals [!Ref InstanceConnectCidr, '']]

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MediSlot web app - HTTP from the internet, SSH only from EC2 Instance Connect
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - !If
          - AllowInstanceConnect
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref InstanceConnectCidr
            Description: EC2 Instance Connect (browser based SSH)
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WebAppBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadApplicationPackage
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucketName}/web/*'
              - Sid: ReadWebSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/web/*'
              - Sid: ReportBootstrapResult
                Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebInstanceRole

  WebInstance:
    Type: AWS::EC2::Instance
    # The stack only succeeds once the application answers /healthz (see the end of UserData).
    # A broken boot therefore fails the deployment instead of leaving a silent dead website.
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref WebInstanceProfile
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/medislot-bootstrap.log) 2>&1

          # Tell CloudFormation whether the boot worked (a failure rolls the stack back with a clear reason).
          dnf install -y aws-cfn-bootstrap || true
          signal() { /opt/aws/bin/cfn-signal -e "$1" --stack ${AWS::StackName} --resource WebInstance --region ${AWS::Region} || true; }
          trap 'signal 1' ERR

          dnf install -y python3-pip
          useradd --system --home-dir /opt/medislot --shell /sbin/nologin medislot || true
          mkdir -p /opt/medislot/lib

          # The instance is disposable: the application is pulled from S3 on every boot.
          aws s3 cp s3://${ArtifactsBucketName}/${WebPackageKey} /tmp/web.zip --region ${AWS::Region}
          python3 -m zipfile -e /tmp/web.zip /opt/medislot

          # Install into a private directory. A plain "pip install" fails on Amazon Linux because
          # requests/urllib3 are owned by the operating system's package manager.
          python3 -m pip install --no-cache-dir --upgrade --target /opt/medislot/lib -r /opt/medislot/requirements.txt
          chown -R medislot:medislot /opt/medislot

          cat > /etc/medislot-web.env <<'ENVEOF'
          API_BASE_URL=${ApiBaseUrl}
          AWS_DEFAULT_REGION=${AWS::Region}
          SECRET_KEY_PARAMETER=/${ProjectName}/${EnvironmentName}/web/flask-secret-key
          PYTHONPATH=/opt/medislot/lib
          ENVEOF
          chmod 600 /etc/medislot-web.env

          # ONE gunicorn worker (many threads): sessions are kept in that process's memory.
          cat > /etc/systemd/system/medislot-web.service <<'UNITEOF'
          [Unit]
          Description=MediSlot web application (Flask via gunicorn)
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=medislot
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/etc/medislot-web.env
          ExecStart=/usr/bin/python3 -m gunicorn --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:80 --access-logfile - --error-logfile - app:app
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNITEOF

          systemctl daemon-reload
          systemctl enable --now medislot-web.service

          # Wait until the site really answers before reporting success.
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost/healthz; then break; fi
            sleep 3
          done
          curl -fsS http://localhost/healthz
          signal 0

  WebElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-web-eip'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  WebElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt WebElasticIp.AllocationId
      InstanceId: !Ref WebInstance

Outputs:
  WebUrl:
    Description: Public URL of the MediSlot web application.
    Value: !Sub 'http://${WebElasticIp}'
  WebInstanceId:
    Value: !Ref WebInstance
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
